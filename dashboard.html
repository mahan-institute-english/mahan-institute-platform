<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHAN - User Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white font-bold px-3 py-2 rounded-lg text-lg">MAHAN</div>
            <div>
                <h1 class="text-sm font-bold tracking-wide" id="userName">User Dashboard</h1>
                <p class="text-xs text-slate-400" id="userIdDisplay">ID: --</p>
            </div>
        </div>
        <button onclick="logout()" class="bg-red-600/20 text-red-400 border border-red-500/50 hover:bg-red-600 hover:text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">
            <i class="fa-solid fa-power-off"></i> Logout
        </button>
    </header>

    <main class="flex-grow p-4 max-w-4xl mx-auto w-full space-y-6 py-8">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="bg-amber-500/20 text-amber-400 border border-amber-500/40 text-xs px-3 py-1 rounded-full font-semibold" id="userStatus">Unactive</span>
                <h2 class="text-2xl font-bold mt-2">Welcome Back!</h2>
                <p class="text-xs text-slate-400 mt-1">Your learning and earning network status overview.</p>
            </div>
            <div class="text-right bg-slate-900 p-4 rounded-xl border border-slate-700 w-full md:w-auto">
                <div class="text-xs text-slate-400">Total Reward Limit</div>
                <div class="text-xl font-bold text-emerald-400" id="totalLimit">₹50,000</div>
            </div>
        </div>

        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl space-y-3">
            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300"><i class="fa-solid fa-link text-blue-400 mr-2"></i> Your Referral Link</h3>
            <div class="flex gap-2">
                <input type="text" id="refLink" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-300">
                <button onclick="copyRef()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold transition whitespace-nowrap">Copy</button>
            </div>
        </div>
    </main>

    <footer class="bg-slate-800 border-t border-slate-700 p-4 text-center text-xs text-slate-400">
        &copy; 2026 MAHAN - The Institute Of English. All Rights Reserved.
    </footer>

    <script>
        const userData = JSON.parse(localStorage.getItem('mahan_user'));
        if(!userData) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('userName').innerText = userData.name;
            document.getElementById('userIdDisplay').innerText = "ID: " + userData.user_id;
            document.getElementById('userStatus').innerText = userData.status;
            document.getElementById('totalLimit').innerText = "₹" + (userData.total_limit || 50000);
            
            const refUrl = window.location.origin + window.location.pathname.replace('dashboard.html', 'register.html') + '?ref=' + userData.user_id;
            document.getElementById('refLink').value = refUrl;
        }

        function logout() {
            localStorage.removeItem('mahan_user');
            window.location.href = 'login.html';
        }

        function copyRef() {
            const copyText = document.getElementById("refLink");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Referral link copied!");
        }
    </script>
</body>
</html>
