<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHAN - The Institute Of English | Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="bg-blue-600 text-white font-bold px-3 py-2 rounded-lg text-lg">MAHAN</a>
            <div>
                <h1 class="text-lg font-bold tracking-wide">The Institute Of English</h1>
                <p class="text-xs text-slate-400">Secure Member Portal</p>
            </div>
        </div>
        <div>
            <a href="index.html" class="text-slate-300 hover:text-white text-sm font-semibold"><i class="fa-solid fa-house mr-1"></i> Home</a>
        </div>
    </header>

    <!-- Login Section -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl">
            <div class="text-center mb-6">
                <div class="inline-block bg-blue-600 text-white p-3 rounded-full mb-3 shadow-lg">
                    <i class="fa-solid fa-user-lock text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-blue-400">MEMBER SIGN IN</h2>
                <p class="text-xs text-slate-400 mt-1">Enter your User ID and Password</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">User ID / Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="loginId" required placeholder="e.g. MAHAN101" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-white focus:outline-none focus:border-blue-500 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="loginPass" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-white focus:outline-none focus:border-blue-500 text-sm">
                    </div>
                </div>

                <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200 text-sm">
                    SIGN IN NOW
                </button>
            </form>

            <div class="mt-6 text-center border-t border-slate-700 pt-4">
                <p class="text-xs text-slate-400">Don't have an account yet?</p>
                <a href="register.html" class="inline-block mt-2 text-sm text-emerald-400 font-semibold hover:underline">Register Free & Get Referral Link</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4 text-center text-xs text-slate-400">
        &copy; 2026 MAHAN - The Institute Of English. All Rights Reserved.
    </footer>

    <!-- Login Logic Script -->
    <script>
        const SUPABASE_URL = 'https://wzrbsvwmrymkpzwmgypb.supabase.co';
        const SUPABASE_KEY = 'Sb_publishable_qasb0y09kMEZbDZLQRbiLg_YoMF_iyH';
        const _db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleLogin(e) {
            e.preventDefault();
            let btn = document.getElementById('loginBtn');
            btn.innerText = "Checking Database...";
            btn.disabled = true;

            let idInput = document.getElementById('loginId').value.trim();
            let passInput = document.getElementById('loginPass').value.trim();

            // Check Master Admin
            if((idInput === "MAHAN101" || idInput === "haresh@gmail.com") && passInput === "admin123") {
                let adminObj = {
                    user_id: "MAHAN101",
                    name: "Haresh N Makasana",
                    role: "admin",
                    status: "Active"
                };
                localStorage.setItem('mahan_current', JSON.stringify(adminObj));
                window.location.href = "admin.html";
                return;
            }

            // Fetch user from Supabase database
            const { data, error } = await _db
                .from('users')
                .select('*')
                .or(`user_id.eq.${idInput},email.eq.${idInput}`)
                .eq('password', passInput)
                .single();

            if (error || !data) {
                alert("Invalid User ID, Email or Password!");
                btn.innerText = "SIGN IN NOW";
                btn.disabled = false;
            } else {
                localStorage.setItem('mahan_current', JSON.stringify(data));
                alert("Login Successful! Redirecting...");
                if(data.role === 'admin') {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "dashboard.html";
                }
            }
        }
    </script>

</body>
</html>
