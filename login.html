<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHAN - Member Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-xl space-y-4">
        <div class="text-center space-y-2">
            <div class="inline-flex bg-blue-600/20 text-blue-400 p-3 rounded-full border border-blue-500/30">
                <i class="fa-solid fa-right-to-bracket text-xl"></i>
            </div>
            <h2 class="text-xl font-bold text-white">MEMBER SIGN IN</h2>
            <p class="text-xs text-slate-400">Enter your User ID and Password to access Dashboard</p>
        </div>
        
        <form id="loginForm" class="space-y-3 pt-2">
            <div>
                <label class="text-xs text-slate-400">User ID</label>
                <input type="text" id="userId" required placeholder="e.g. MAHAN9396" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-white uppercase focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="text-xs text-slate-400">Password</label>
                <input type="password" id="password" required placeholder="Enter password" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-white focus:border-blue-500 outline-none">
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition text-sm shadow">Sign In to Dashboard</button>
        </form>

        <p id="msg" class="text-xs text-center"></p>

        <div class="text-center text-xs pt-2 border-t border-slate-700">
            <span class="text-slate-400">Don't have an account?</span> 
            <a href="register.html" class="text-emerald-400 font-semibold hover:underline ml-1">Register Free</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wzrbsvwmrymkpzwmgypb.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cmJzdndtcnlta3B6d21neXBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDc1NzQsImV4cCI6MjEwMzMyMzU3NH0.5ulY5LW3AQEPFDP__iOSJssgNafTSe9Yu4gEqZF7sLc";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.disabled = true;
            msg.innerText = "Checking credentials...";
            msg.className = "text-xs text-center text-amber-400";

            const userId = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                // Query supabase for user_id and password match
                const { data, error } = await _supabase
                    .from('users')
                    .select('*')
                    .eq('user_id', userId)
                    .eq('password', password)
                    .single();

                if (error || !data) {
                    msg.innerText = "Invalid User ID or Password!";
                    msg.className = "text-xs text-center text-red-400 font-semibold";
                    loginBtn.disabled = false;
                    return;
                }

                // Save user session in browser storage
                localStorage.setItem('mahan_user', JSON.stringify(data));

                msg.innerText = "Login Successful! Redirecting...";
                msg.className = "text-xs text-center text-emerald-400 font-semibold";
                
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1000);

            } catch (err) {
                msg.innerText = "Error: " + err.message;
                msg.className = "text-xs text-center text-red-400";
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
