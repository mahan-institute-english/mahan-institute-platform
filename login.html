<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHAN - Member Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
    
    <div class="max-w-md w-full bg-slate-800/80 backdrop-blur-sm border border-slate-700 p-8 rounded-2xl shadow-2xl space-y-6">
        
        <!-- Premium CSS Logo (MAHAN Gold Edition) -->
        <div class="flex flex-col items-center justify-center space-y-4 mb-4 mt-2">
            <!-- MAHAN Gold Badge -->
            <div class="relative flex items-center justify-center px-6 py-3 bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl shadow-[0_8px_16px_rgba(0,0,0,0.4)] border border-slate-700/50">
                <!-- Top Glowing Accent Line -->
                <div class="absolute top-0 inset-x-4 h-[1px] bg-gradient-to-r from-transparent via-yellow-500 to-transparent opacity-50"></div>
                
                <!-- MAHAN Text in Gold Gradient -->
                <span class="text-4xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-500 to-amber-600" style="font-family: 'Arial Black', sans-serif;">
                    MAHAN
                </span>
                
                <!-- Glowing Gold Network Dot -->
                <div class="absolute -top-1.5 -right-1.5 w-3.5 h-3.5 bg-gradient-to-br from-yellow-400 to-amber-600 rounded-full animate-pulse shadow-[0_0_12px_rgba(245,158,11,0.8)] border-2 border-slate-900"></div>
            </div>
            
            <!-- Brand Name Below -->
            <div class="flex flex-col items-center justify-center text-center">
                <div class="flex items-baseline space-x-1.5">
                    <span class="text-2xl font-black tracking-widest text-white uppercase leading-none">MAHAN</span>
                    <span class="text-2xl font-black tracking-widest text-blue-500 uppercase leading-none">Institute</span>
                </div>
                <!-- Tagline in subtle Gold -->
                <span class="text-[9px] font-bold tracking-[0.3em] text-yellow-500/80 uppercase leading-none mt-2">Premium English & Development</span>
            </div>
        </div>
        
        <!-- Login Form -->
        <form id="loginForm" class="space-y-5 pt-4">
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">User ID / Mobile Number</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                        <i class="fa-regular fa-user"></i>
                    </div>
                    <input type="text" id="loginId" required class="w-full bg-slate-900 border border-slate-700 rounded-lg py-3 pl-10 pr-3 text-sm text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition placeholder-slate-600" placeholder="e.g. STU123456 or 9876543210">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg py-3 pl-10 pr-3 text-sm text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition placeholder-slate-600" placeholder="••••••••">
                </div>
            </div>

            <p id="msg" class="text-sm text-center hidden"></p>

            <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-lg shadow-blue-600/30">
                SIGN IN TO DASHBOARD
            </button>
        </form>

        <div class="flex flex-col items-center pt-4 border-t border-slate-700/50">
            <p class="text-sm text-slate-400">
                Don't have an account? <a href="register.html" class="text-blue-400 hover:text-blue-300 font-semibold transition">Register Free</a>
            </p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wzrbsvwmrymkpzwmgypb.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cmJzdndtcnlta3B6d21neXBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDc1NzQsImV4cCI6MjEwMzMyMzU3NH0.5ulY5LW3AQEPFDP__iOSJssgNafTSe9Yu4gEqZF7sLc";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            const loginBtn = document.getElementById('loginBtn');
            const loginId = document.getElementById('loginId').value.trim();
            const password = document.getElementById('password').value.trim();

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Checking...';
            msg.className = "text-sm text-center text-amber-400 block";
            msg.innerText = "Verifying details...";

            try {
                const { data, error } = await _supabase
                    .from('users')
                    .select('*')
                    .or(`user_id.eq.${loginId},mobile.eq.${loginId}`)
                    .eq('password', password)
                    .maybeSingle();

                if (error || !data) {
                    msg.innerText = "❌ ખોટો ID/Mobile અથવા Password!";
                    msg.className = "text-sm text-center text-red-400 block bg-red-900/20 py-2 rounded-lg";
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'SIGN IN TO DASHBOARD';
                    return;
                }

                localStorage.setItem('mahan_user', JSON.stringify(data));
                msg.innerText = "✅ Login Successful! Redirecting...";
                msg.className = "text-sm text-center text-emerald-400 block bg-emerald-900/20 py-2 rounded-lg";
                
                setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);

            } catch (err) {
                msg.innerText = "Network Error. Please try again.";
                msg.className = "text-sm text-center text-red-400 block";
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'SIGN IN TO DASHBOARD';
            }
        });
    </script>
</body>
</html>
