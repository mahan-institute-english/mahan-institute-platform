<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHAN - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl w-full max-w-md space-y-6">
        <div class="text-center space-y-2">
            <div class="bg-blue-600/20 text-blue-400 w-16 h-16 rounded-full flex items-center justify-center mx-auto text-2xl mb-2">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-wide">MEMBER SIGN IN</h1>
            <p class="text-xs text-slate-400">Enter your User ID and Password</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">User ID</label>
                <input type="text" id="userId" required placeholder="e.g. MAHAN101" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
            </div>

            <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg text-sm transition tracking-wide">
                SIGN IN TO DASHBOARD
            </button>
        </form>

        <div class="text-center text-xs text-slate-400">
            Don't have an account? <a href="register.html" class="text-blue-400 font-semibold hover:underline">Register Free</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wzrbsvwmrymkpzwmgypb.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cmJzdndtcnlta3B6d21neXBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDc1NzQsImV4cCI6MjEwMzMyMzU3NH0.5ulY5LW3AQEPFDP__iOSJssgNafTSe9Yu4gEqZF7sLc";
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerText = "Checking...";

            const userId = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value;

            // Master Admin shortcut
            if(userId === 'MAHAN101' && password === 'admin123') {
                localStorage.setItem('mahan_user', JSON.stringify({ user_id: 'MAHAN101', role: 'admin', name: 'Master Admin' }));
                window.location.href = 'admin.html';
                return;
            }

            const { data, error } = await _supabase
                .from('users')
                .select('*')
                .eq('user_id', userId)
                .eq('password', password)
                .single();

            if (error || !data) {
                alert("Invalid User ID or Password!");
                btn.disabled = false;
                btn.innerText = "SIGN IN TO DASHBOARD";
            } else {
                localStorage.setItem('mahan_user', JSON.stringify(data));
                if(data.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            }
        });
    </script>
</body>
</html>
