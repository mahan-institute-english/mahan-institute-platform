<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHAN - Admin Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen p-4 font-sans">

    <!-- SECURITY LAYER 1: Admin Login Gate -->
    <div id="adminLoginGate" class="flex flex-col items-center justify-center min-h-[80vh]">
        <div class="bg-slate-800 border border-amber-500/50 p-8 rounded-2xl shadow-[0_0_30px_rgba(245,158,11,0.15)] w-full max-w-sm text-center relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/20 rounded-full blur-2xl"></div>
            
            <i class="fa-solid fa-shield-halved text-5xl text-amber-500 mb-4 relative z-10"></i>
            <h2 class="text-xl font-bold text-white tracking-widest uppercase mb-1 relative z-10">Admin Access</h2>
            <p class="text-[10px] text-slate-400 uppercase tracking-widest mb-6 relative z-10">Master Control Room</p>
            
            <div class="space-y-4 relative z-10">
                <div class="relative">
                    <i class="fa-solid fa-user-shield absolute left-3 top-3.5 text-slate-500"></i>
                    <input type="text" id="adminId" placeholder="Admin ID" class="w-full bg-[#0f172a] border border-slate-600 rounded-xl py-3 pl-10 pr-3 text-sm text-white focus:border-amber-500 outline-none uppercase font-mono">
                </div>
                <div class="relative">
                    <i class="fa-solid fa-key absolute left-3 top-3.5 text-slate-500"></i>
                    <input type="password" id="adminPass" placeholder="Admin Password" class="w-full bg-[#0f172a] border border-slate-600 rounded-xl py-3 pl-10 pr-3 text-sm text-white focus:border-amber-500 outline-none font-mono">
                </div>
                <p id="adminLoginMsg" class="text-xs font-bold hidden"></p>
                <button onclick="unlockAdmin()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-unlock"></i> UNLOCK PANEL
                </button>
                <button onclick="window.location.href='dashboard.html'" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 rounded-xl transition text-xs mt-2">
                    Back to Dashboard
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN ADMIN PANEL (Hidden by Default) -->
    <div id="mainAdminPanel" class="max-w-2xl mx-auto space-y-6 hidden pb-12">
        
        <!-- Admin Header -->
        <div class="bg-gradient-to-r from-slate-800 to-slate-900 border border-amber-500/30 p-5 rounded-2xl shadow-2xl flex justify-between items-center relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl"></div>
            <div class="relative z-10 flex items-center gap-4">
                <div class="w-12 h-12 bg-amber-500/20 text-amber-400 rounded-xl flex items-center justify-center border border-amber-500/30 shadow-lg">
                    <i class="fa-solid fa-crown text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wider uppercase">Admin Panel</h1>
                    <p class="text-xs text-amber-500 font-mono tracking-widest">System Unlocked</p>
                </div>
            </div>
            <button onclick="lockSystem()" class="relative z-10 bg-red-600/20 hover:bg-red-600 border border-red-500/50 text-red-400 hover:text-white px-4 py-2 rounded-lg text-xs font-bold transition">
                <i class="fa-solid fa-lock mr-1"></i> Lock
            </button>
        </div>
        
        <!-- Live Statistics -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl text-center shadow-lg">
                <i class="fa-solid fa-users text-blue-400 text-xl mb-1"></i>
                <h3 class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Total Users</h3>
                <p id="totalUsers" class="text-xl font-black text-white mt-1">0</p>
            </div>
            <div class="bg-slate-800 border border-emerald-500/30 p-4 rounded-xl text-center shadow-lg">
                <i class="fa-solid fa-user-check text-emerald-400 text-xl mb-1"></i>
                <h3 class="text-[10px] text-emerald-500 font-bold uppercase tracking-wider">Active</h3>
                <p id="activeUsers" class="text-xl font-black text-white mt-1">0</p>
            </div>
            <div class="bg-slate-800 border border-red-500/30 p-4 rounded-xl text-center shadow-lg">
                <i class="fa-solid fa-user-xmark text-red-400 text-xl mb-1"></i>
                <h3 class="text-[10px] text-red-500 font-bold uppercase tracking-wider">Unactive</h3>
                <p id="unactiveUsers" class="text-xl font-black text-white mt-1">0</p>
            </div>
            <div class="bg-slate-800 border border-amber-500/30 p-4 rounded-xl text-center shadow-lg flex flex-col justify-center">
                <i class="fa-solid fa-file-excel text-amber-400 text-xl mb-1"></i>
                <button onclick="downloadExcel()" class="mt-1 w-full bg-amber-600 hover:bg-amber-700 text-white text-[10px] font-bold py-1.5 rounded transition shadow-lg">
                    Backup CSV
                </button>
            </div>
        </div>

        <!-- Manual Activation & Search Section -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl">
            <h3 class="text-sm font-bold text-white mb-4 flex items-center gap-2 border-b border-slate-700 pb-3">
                <i class="fa-solid fa-magnifying-glass text-blue-400"></i> Search & Manage Student
            </h3>
            
            <div class="flex gap-3 mb-4">
                <input type="text" id="searchInput" placeholder="Enter User ID or Mobile" class="flex-1 bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-sm text-white outline-none focus:border-emerald-500 uppercase font-mono">
                <button onclick="searchUser()" id="searchBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 rounded-xl text-sm font-bold transition shadow-lg">
                    Search
                </button>
            </div>

            <p id="searchMsg" class="text-xs text-center hidden mb-3"></p>

            <!-- Searched User Details -->
            <div id="userDetailsBox" class="hidden bg-[#0f172a] border border-slate-600 rounded-xl p-4 space-y-3">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-[10px] text-slate-400 uppercase tracking-widest mb-1">Student Name</p>
                        <p id="sName" class="text-base font-bold text-white"></p>
                        <p id="sId" class="text-xs text-blue-400 font-mono mt-0.5"></p>
                    </div>
                    <span id="sStatus" class="text-[10px] font-bold px-3 py-1 rounded-md border tracking-widest"></span>
                </div>
                
                <div class="grid grid-cols-2 gap-2 border-t border-slate-700 pt-3">
                    <div><p class="text-[10px] text-slate-500">Mobile</p><p id="sMobile" class="text-xs text-slate-300 font-mono"></p></div>
                    <div><p class="text-[10px] text-slate-500">Sponsor</p><p id="sSponsor" class="text-xs text-slate-300 font-mono"></p></div>
                    <div><p class="text-[10px] text-slate-500">State / City</p><p id="sLoc" class="text-xs text-slate-300"></p></div>
                    <div><p class="text-[10px] text-slate-500">Join Date</p><p id="sDate" class="text-xs text-slate-300"></p></div>
                </div>

                <!-- Admin Action Buttons (Triggers Warning Modal first) -->
                <div class="flex gap-3 pt-3 border-t border-slate-700 mt-3">
                    <button id="btnActivate" onclick="promptStatusChange('Active')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg text-xs font-bold transition shadow-lg hidden">
                        <i class="fa-solid fa-check-circle mr-1"></i> Make Active
                    </button>
                    <button id="btnUnactivate" onclick="promptStatusChange('Unactive')" class="flex-1 bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-500/50 py-2.5 rounded-lg text-xs font-bold transition hidden">
                        <i class="fa-solid fa-times-circle mr-1"></i> Make Unactive
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SECURITY LAYER 2: Confirmation Modal (Warning Box) -->
    <div id="confirmModal" class="fixed inset-0 bg-[#0f172a]/95 backdrop-blur-md hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-600 p-6 rounded-2xl w-full max-w-sm shadow-2xl text-center">
            <h3 id="confirmTitle" class="text-lg font-bold text-white mb-2"></h3>
            <p id="confirmDesc" class="text-xs text-slate-300 mb-6 bg-[#0f172a] p-3 rounded-lg border border-slate-700"></p>
            
            <div class="flex gap-3">
                <button id="confirmBtn" onclick="executeStatusChange()" class="flex-1 py-3 rounded-xl text-sm font-bold transition shadow-lg"></button>
                <button onclick="closeConfirmModal()" class="flex-1 bg-slate-600 hover:bg-slate-500 text-white py-3 rounded-xl text-sm font-bold transition">Cancel</button>
            </div>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://wzrbsvwmrymkpzwmgypb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cmJzdndtcnlta3B6d21neXBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDc1NzQsImV4cCI6MjEwMzMyMzU3NH0.5ulY5LW3AQEPFDP__iOSJssgNafTSe9Yu4gEqZF7sLc";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allUsersData = [];
    let currentSearchedId = null;
    let pendingStatusAction = '';

    // Step 1: Admin Login Gate Logic
    async function unlockAdmin() {
        const id = document.getElementById('adminId').value.trim().toUpperCase();
        const pass = document.getElementById('adminPass').value.trim();
        const msg = document.getElementById('adminLoginMsg');

        // માત્ર મુખ્ય એડમિન આઈડી જ અહી ચાલશે
        if(id !== 'MAHAN101' && id !== '7016623939') {
            msg.innerText = "❌ Access Denied: Not an Admin ID!";
            msg.className = "text-xs font-bold text-red-400 block";
            return;
        }
        if(!pass) {
            msg.innerText = "Please enter password.";
            msg.className = "text-xs font-bold text-red-400 block";
            return;
        }

        msg.innerText = "Verifying Security Credentials...";
        msg.className = "text-xs font-bold text-amber-400 block";

        try {
            // ડેટાબેઝમાં પાસવર્ડ ચેક કરો
            const { data, error } = await _supabase.from('users')
                .select('*')
                .or(`user_id.eq.${id},mobile.eq.${id}`)
                .eq('password', pass)
                .maybeSingle();

            if (error || !data) {
                msg.innerText = "❌ Incorrect Password! Try again.";
                msg.className = "text-xs font-bold text-red-400 block";
                return;
            }

            // પાસવર્ડ સાચો છે -> ગેટ ખોલો
            document.getElementById('adminLoginGate').classList.add('hidden');
            document.getElementById('mainAdminPanel').classList.remove('hidden');
            fetchDashboardStats();

        } catch (err) {
             msg.innerText = "Network Error!";
             msg.className = "text-xs font-bold text-red-400 block";
        }
    }

    // System Lock Function
    function lockSystem() {
        document.getElementById('mainAdminPanel').classList.add('hidden');
        document.getElementById('adminLoginGate').classList.remove('hidden');
        document.getElementById('adminPass').value = '';
        document.getElementById('adminLoginMsg').classList.add('hidden');
    }

    // Live Dashboard Stats
    async function fetchDashboardStats() {
        try {
            const { data, error } = await _supabase.from('users').select('*');
            if (error) throw error;
            
            allUsersData = data; 
            const total = data.length;
            const active = data.filter(u => (u.status || '').toLowerCase() === 'active').length;
            const unactive = total - active;

            document.getElementById('totalUsers').innerText = total;
            document.getElementById('activeUsers').innerText = active;
            document.getElementById('unactiveUsers').innerText = unactive;
        } catch (err) { console.error(err); }
    }

    // Search Student
    async function searchUser() {
        const searchVal = document.getElementById('searchInput').value.trim().toUpperCase();
        const msg = document.getElementById('searchMsg');
        const box = document.getElementById('userDetailsBox');
        const btn = document.getElementById('searchBtn');

        if(!searchVal) return;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        msg.classList.add('hidden');
        box.classList.add('hidden');

        try {
            const { data, error } = await _supabase.from('users')
                .select('*')
                .or(`user_id.eq.${searchVal},mobile.eq.${searchVal}`)
                .maybeSingle();

            if (error || !data) {
                msg.innerText = "❌ No student found with this ID or Mobile.";
                msg.className = "text-xs text-center text-red-400 block mb-3 font-semibold";
            } else {
                currentSearchedId = data.user_id;
                document.getElementById('sName').innerText = data.name;
                document.getElementById('sId').innerText = data.user_id;
                document.getElementById('sMobile').innerText = data.mobile;
                document.getElementById('sSponsor').innerText = data.sponsor || 'None';
                document.getElementById('sLoc').innerText = `${data.city || '-'}, ${data.state || '-'}`;
                
                const d = new Date(data.created_at);
                document.getElementById('sDate').innerText = d.toLocaleDateString('en-IN') || '-';

                const sBadge = document.getElementById('sStatus');
                const btnAct = document.getElementById('btnActivate');
                const btnUnact = document.getElementById('btnUnactivate');

                if ((data.status || '').toLowerCase() === 'active') {
                    sBadge.innerText = 'ACTIVE';
                    sBadge.className = "text-[10px] font-bold px-3 py-1 rounded-md border tracking-widest text-emerald-400 bg-emerald-400/10 border-emerald-400/20";
                    btnAct.classList.add('hidden');
                    btnUnact.classList.remove('hidden');
                } else {
                    sBadge.innerText = 'UNACTIVE';
                    sBadge.className = "text-[10px] font-bold px-3 py-1 rounded-md border tracking-widest text-red-400 bg-red-400/10 border-red-400/20";
                    btnAct.classList.remove('hidden');
                    btnUnact.classList.add('hidden');
                }
                box.classList.remove('hidden');
            }
        } catch (err) { console.error(err); }
        btn.innerHTML = 'Search';
    }

    // Step 2: Warning Modal Logic
    function promptStatusChange(status) {
        if (!currentSearchedId) return;
        pendingStatusAction = status;
        
        const modal = document.getElementById('confirmModal');
        const title = document.getElementById('confirmTitle');
        const desc = document.getElementById('confirmDesc');
        const btn = document.getElementById('confirmBtn');

        if(status === 'Active') {
            title.innerHTML = '<i class="fa-solid fa-check-circle text-emerald-400 mr-2"></i> Confirm Activation';
            desc.innerHTML = `Are you sure you want to <strong>ACTIVATE</strong> student <span class="text-amber-400">${currentSearchedId}</span>?`;
            btn.innerText = "Yes, Make Active";
            btn.className = "flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl text-sm font-bold transition shadow-lg shadow-emerald-600/30";
        } else {
            title.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-red-500 mr-2"></i> Warning: Deactivation';
            desc.innerHTML = `Are you sure you want to <strong>UNACTIVE</strong> student <span class="text-amber-400">${currentSearchedId}</span>? <br><br> They will lose their dashboard earnings access!`;
            btn.innerText = "Yes, Make Unactive";
            btn.className = "flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl text-sm font-bold transition shadow-lg shadow-red-600/30";
        }
        modal.classList.remove('hidden');
    }

    function closeConfirmModal() {
        document.getElementById('confirmModal').classList.add('hidden');
        pendingStatusAction = '';
    }

    async function executeStatusChange() {
        const btn = document.getElementById('confirmBtn');
        btn.innerText = "Processing...";
        btn.disabled = true;

        try {
            const { error } = await _supabase
                .from('users')
                .update({ status: pendingStatusAction })
                .eq('user_id', currentSearchedId);

            if (error) throw error;
            
            closeConfirmModal();
            searchUser(); 
            fetchDashboardStats(); 
            
        } catch (err) {
            alert("Error: " + err.message);
            closeConfirmModal();
        }
        btn.disabled = false;
    }

    // CSV Download
    function downloadExcel() {
        if (!allUsersData || allUsersData.length === 0) { alert("No data available."); return; }
        const headers = ["User ID", "Name", "Mobile", "Password", "Status", "Sponsor ID", "State", "City", "Join Date"];
        const csvRows = [];
        csvRows.push(headers.join(','));

        allUsersData.forEach(user => {
            const dateStr = user.created_at ? new Date(user.created_at).toLocaleDateString('en-IN') : '-';
            const row = [
                `"${user.user_id}"`, `"${user.name}"`, `"${user.mobile}"`, `"${user.password}"`,
                `"${user.status}"`, `"${user.sponsor}"`, `"${user.state || ''}"`, `"${user.city || ''}"`, `"${dateStr}"`
            ];
            csvRows.push(row.join(','));
        });

        const csvString = csvRows.join('\n');
        const blob = new Blob([csvString], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', `MAHAN_Database_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>
</body>
                    </html>
