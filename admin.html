<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHAN - Admin Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen p-4 font-sans pb-12">

    <!-- SECURITY LAYER -->
    <div id="adminLoginGate" class="flex flex-col items-center justify-center min-h-[80vh]">
        <div class="bg-slate-800 border border-amber-500/50 p-8 rounded-2xl shadow-[0_0_30px_rgba(245,158,11,0.15)] w-full max-w-sm text-center relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/20 rounded-full blur-2xl"></div>
            <i class="fa-solid fa-shield-halved text-5xl text-amber-500 mb-4 relative z-10"></i>
            <h2 class="text-xl font-bold text-white tracking-widest uppercase mb-1 relative z-10">Admin Access</h2>
            <div class="space-y-4 relative z-10">
                <input type="text" id="adminId" placeholder="Admin ID" class="w-full bg-[#0f172a] border border-slate-600 rounded-xl py-3 px-4 text-sm text-white focus:border-amber-500 outline-none uppercase font-mono">
                <input type="password" id="adminPass" placeholder="Admin Password" class="w-full bg-[#0f172a] border border-slate-600 rounded-xl py-3 px-4 text-sm text-white focus:border-amber-500 outline-none font-mono">
                <p id="adminLoginMsg" class="text-xs font-bold hidden"></p>
                <button onclick="unlockAdmin()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold py-3 rounded-xl transition shadow-lg"><i class="fa-solid fa-unlock mr-2"></i> UNLOCK PANEL</button>
            </div>
        </div>
    </div>

    <!-- MAIN ADMIN PANEL -->
    <div id="mainAdminPanel" class="max-w-4xl mx-auto space-y-6 hidden">
        
        <div class="bg-gradient-to-r from-slate-800 to-slate-900 border border-amber-500/30 p-5 rounded-2xl shadow-2xl flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-amber-500/20 text-amber-400 rounded-xl flex items-center justify-center border border-amber-500/30"><i class="fa-solid fa-crown text-2xl"></i></div>
                <div><h1 class="text-xl font-bold text-white tracking-wider uppercase">Admin Panel</h1><p class="text-xs text-amber-500 font-mono tracking-widest">System Unlocked</p></div>
            </div>
            <button onclick="lockSystem()" class="bg-red-600/20 hover:bg-red-600 border border-red-500/50 text-red-400 hover:text-white px-4 py-2 rounded-lg text-xs font-bold transition"><i class="fa-solid fa-lock mr-1"></i> Lock</button>
        </div>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl text-center"><i class="fa-solid fa-users text-blue-400 text-xl mb-1"></i><h3 class="text-[10px] text-slate-400 font-bold uppercase">Total Users</h3><p id="totalUsers" class="text-xl font-black text-white mt-1">0</p></div>
            <div class="bg-slate-800 border border-emerald-500/30 p-4 rounded-xl text-center"><i class="fa-solid fa-user-check text-emerald-400 text-xl mb-1"></i><h3 class="text-[10px] text-emerald-500 font-bold uppercase">Active</h3><p id="activeUsers" class="text-xl font-black text-white mt-1">0</p></div>
            <div class="bg-slate-800 border border-red-500/30 p-4 rounded-xl text-center"><i class="fa-solid fa-user-xmark text-red-400 text-xl mb-1"></i><h3 class="text-[10px] text-red-500 font-bold uppercase">Unactive</h3><p id="unactiveUsers" class="text-xl font-black text-white mt-1">0</p></div>
            <div class="bg-slate-800 border border-amber-500/30 p-4 rounded-xl text-center flex flex-col justify-center gap-2">
                <button onclick="downloadFullDB()" id="btnExcel" class="w-full bg-slate-600 hover:bg-slate-500 text-white text-[10px] font-bold py-2 rounded transition shadow-lg"><i class="fa-solid fa-download mr-1"></i> Live Master CSV</button>
                <button onclick="downloadBankPayoutList()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-bold py-2 rounded transition shadow-lg"><i class="fa-solid fa-building-columns mr-1"></i> Bank Payout CSV</button>
            </div>
        </div>

        <!-- Pending Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-800 border border-blue-500/30 rounded-2xl p-5 shadow-xl">
                <h3 class="text-sm font-bold text-white mb-4 border-b border-slate-700 pb-3"><i class="fa-solid fa-user-plus text-blue-400 mr-2"></i> Pending Activations (UTR)</h3>
                <div id="pendingActivationsContainer" class="space-y-3 max-h-72 overflow-y-auto pr-2"><p class="text-xs text-slate-500 text-center py-4">Checking requests...</p></div>
            </div>
            <div class="bg-slate-800 border border-emerald-500/30 rounded-2xl p-5 shadow-xl">
                <h3 class="text-sm font-bold text-white mb-4 border-b border-slate-700 pb-3"><i class="fa-solid fa-money-bill-transfer text-emerald-400 mr-2"></i> Pending Payouts</h3>
                <div id="pendingWithdrawalsContainer" class="space-y-3 max-h-72 overflow-y-auto pr-2"><p class="text-xs text-slate-500 text-center py-4">Checking payouts...</p></div>
            </div>
        </div>

        <!-- Platform Settings -->
        <div class="bg-slate-800 border border-amber-500/30 rounded-2xl p-5 shadow-xl">
            <h3 class="text-sm font-bold text-white mb-4 border-b border-slate-700 pb-3"><i class="fa-solid fa-tower-broadcast text-amber-400 mr-2"></i> Platform Live Settings</h3>
            <div class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="text-[10px] text-slate-400 uppercase tracking-widest">Payment QR Image URL</label><input type="text" id="qrInput" class="w-full mt-1 bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-xs text-white outline-none focus:border-amber-500"></div>
                    <div><label class="text-[10px] text-slate-400 uppercase tracking-widest">Activation Fee Amount</label><input type="text" id="feeInput" placeholder="5000" class="w-full mt-1 bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-xs text-white outline-none focus:border-amber-500 font-mono"></div>
                </div>
                <div><label class="text-[10px] text-slate-400 uppercase tracking-widest">Live News Ticker</label><input type="text" id="liveNewsInput" class="w-full mt-1 bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-sm text-white outline-none focus:border-amber-500"></div>
                <div><label class="text-[10px] text-slate-400 uppercase tracking-widest">Dashboard Video Embed URL</label><input type="text" id="videoUrlInput" class="w-full mt-1 bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-sm text-white outline-none focus:border-amber-500 font-mono"></div>
                
                <div class="border-t border-slate-700 pt-4 mt-2">
                    <label class="text-[10px] text-blue-400 font-bold uppercase tracking-widest mb-3 block">Social Media Links</label>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="ytInput" placeholder="YouTube Link" class="bg-[#0f172a] border border-slate-600 rounded-lg p-2 text-xs text-white">
                        <input type="text" id="igInput" placeholder="Instagram Link" class="bg-[#0f172a] border border-slate-600 rounded-lg p-2 text-xs text-white">
                        <input type="text" id="fbInput" placeholder="Facebook Link" class="bg-[#0f172a] border border-slate-600 rounded-lg p-2 text-xs text-white">
                        <input type="text" id="waInput" placeholder="WhatsApp Group Link" class="bg-[#0f172a] border border-slate-600 rounded-lg p-2 text-xs text-white">
                    </div>
                </div>
                <button onclick="savePlatformSettings()" id="settingsBtn" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl transition"><i class="fa-solid fa-cloud-arrow-up mr-2"></i> Update Live Platform</button>
            </div>
        </div>

        <!-- Live DB Table -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-4 border-b border-slate-700 pb-4">
                <h3 class="text-sm font-bold text-white flex items-center gap-2"><i class="fa-solid fa-table-list text-blue-400"></i> Live Member Database</h3>
                <div class="flex gap-2 w-full md:w-auto">
                    <select id="statusFilter" onchange="renderLiveTable()" class="bg-[#0f172a] border border-slate-600 text-xs text-white p-2 rounded-lg outline-none">
                        <option value="All">All Status</option><option value="Active">Active</option><option value="Unactive">Unactive</option>
                    </select>
                    <input type="text" id="tableSearch" onkeyup="renderLiveTable()" placeholder="Search Name/ID..." class="flex-1 md:w-48 bg-[#0f172a] border border-slate-600 rounded-lg p-2 text-xs text-white outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="overflow-x-auto border border-slate-700 rounded-xl">
                <table class="w-full text-left text-xs whitespace-nowrap">
                    <thead class="bg-[#0f172a] text-slate-400 uppercase tracking-wider"><tr><th class="p-3">User ID</th><th class="p-3">Name</th><th class="p-3">Mobile</th><th class="p-3">Sponsor</th><th class="p-3">Status</th><th class="p-3 text-center">Action</th></tr></thead>
                    <tbody id="liveTableBody" class="divide-y divide-slate-800 text-slate-300"><tr><td colspan="6" class="p-4 text-center">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://wzrbsvwmrymkpzwmgypb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cmJzdndtcnlta3B6d21neXBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDc1NzQsImV4cCI6MjEwMzMyMzU3NH0.5ulY5LW3AQEPFDP__iOSJssgNafTSe9Yu4gEqZF7sLc";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allUsersData = [];

    function formatURL(url) { if (!url) return ''; url = url.trim(); if (url && !url.startsWith('http')) return 'https://' + url; return url; }

    async function unlockAdmin() {
        const id = document.getElementById('adminId').value.trim().toUpperCase(); const pass = document.getElementById('adminPass').value.trim(); const msg = document.getElementById('adminLoginMsg');
        if(id !== 'MAHAN101' && id !== '7016623939') { msg.innerText = "❌ Access Denied!"; msg.className = "text-xs font-bold text-red-400 block"; return; }
        if(!pass) { msg.innerText = "Enter password."; msg.className = "text-xs font-bold text-red-400 block"; return; }
        try {
            const { data, error } = await _supabase.from('users').select('*').or(`user_id.eq.${id},mobile.eq.${id}`).eq('password', pass).maybeSingle();
            if (error || !data) { msg.innerText = "❌ Incorrect Password!"; msg.className = "text-xs font-bold text-red-400 block"; return; }
            document.getElementById('adminLoginGate').classList.add('hidden'); document.getElementById('mainAdminPanel').classList.remove('hidden');
            fetchDashboardStats(); loadPlatformSettings(); loadPendingActivations(); loadPendingWithdrawals();
        } catch (err) { msg.innerText = "Network Error!"; msg.className = "text-xs font-bold text-red-400 block"; }
    }
    function lockSystem() { location.reload(); }

    async function fetchDashboardStats() {
        try {
            const { data } = await _supabase.from('users').select('*').order('created_at', { ascending: false });
            allUsersData = data; 
            const active = data.filter(u => (u.status || '').toLowerCase() === 'active').length;
            document.getElementById('totalUsers').innerText = data.length; document.getElementById('activeUsers').innerText = active; document.getElementById('unactiveUsers').innerText = data.length - active;
            renderLiveTable();
        } catch (err) {}
    }

    function renderLiveTable() {
        const tbody = document.getElementById('liveTableBody'); const filter = document.getElementById('statusFilter').value.toLowerCase(); const search = document.getElementById('tableSearch').value.toLowerCase();
        tbody.innerHTML = ''; let count = 0;
        allUsersData.forEach(u => {
            const stat = (u.status || '').toLowerCase(); const uName = (u.name || '').toLowerCase(); const uId = (u.user_id || '').toLowerCase(); const uMob = (u.mobile || '').toLowerCase();
            if (filter !== 'all' && stat !== filter) return;
            if (search && !uName.includes(search) && !uId.includes(search) && !uMob.includes(search)) return;
            count++;
            const statHtml = stat === 'active' ? `<span class="text-[10px] text-emerald-400 bg-emerald-400/10 px-2 rounded border border-emerald-400/20 font-bold uppercase">ACTIVE</span>` : `<span class="text-[10px] text-red-400 bg-red-400/10 px-2 rounded border border-red-400/20 font-bold uppercase">UNACTIVE</span>`;
            const toggleBtn = stat === 'active' ? `<button onclick="toggleUserStatus('${u.user_id}', 'Unactive')" class="text-red-400 hover:text-white bg-red-500/20 px-3 py-1 rounded text-[10px] font-bold transition">Deactivate</button>` : `<button onclick="toggleUserStatus('${u.user_id}', 'Active')" class="bg-emerald-600 text-white px-3 py-1 rounded text-[10px] font-bold transition">Activate</button>`;
            tbody.innerHTML += `<tr class="hover:bg-slate-800/50 border-b border-slate-800/50"><td class="p-3 font-mono text-blue-400">${u.user_id}</td><td class="p-3 font-bold text-white">${u.name}</td><td class="p-3 font-mono">${u.mobile}</td><td class="p-3 text-slate-500">${u.sponsor || '-'}</td><td class="p-3">${statHtml}</td><td class="p-3 text-center">${toggleBtn}</td></tr>`;
        });
        if(count === 0) tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center">No records found.</td></tr>`;
    }

    async function toggleUserStatus(uid, newStatus) { if(confirm(`Make ${uid} ${newStatus}?`)) { await _supabase.from('users').update({ status: newStatus }).eq('user_id', uid); fetchDashboardStats(); } }

    async function loadPlatformSettings() {
        const { data } = await _supabase.from('settings').select('*').limit(1).maybeSingle();
        if(data) {
            document.getElementById('liveNewsInput').value = data.news_text||''; document.getElementById('videoUrlInput').value = data.video_url||'';
            document.getElementById('qrInput').value = data.qr_url||''; document.getElementById('feeInput').value = data.activation_fee||'';
            document.getElementById('ytInput').value = data.yt_link||''; document.getElementById('igInput').value = data.ig_link||''; document.getElementById('fbInput').value = data.fb_link||''; document.getElementById('waInput').value = data.wa_link||'';
        }
    }

    async function savePlatformSettings() {
        const btn = document.getElementById('settingsBtn'); btn.disabled = true; btn.innerText = "Updating...";
        await _supabase.from('settings').delete().neq('news_text', 'dummy'); 
        await _supabase.from('settings').insert([{ 
            news_text: document.getElementById('liveNewsInput').value.trim(), video_url: formatURL(document.getElementById('videoUrlInput').value), 
            qr_url: formatURL(document.getElementById('qrInput').value), activation_fee: document.getElementById('feeInput').value.trim(),
            yt_link: formatURL(document.getElementById('ytInput').value), ig_link: formatURL(document.getElementById('igInput').value), fb_link: formatURL(document.getElementById('fbInput').value), wa_link: formatURL(document.getElementById('waInput').value) 
        }]);
        alert("Platform Updated!"); btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-2"></i> Update Live Platform';
    }

    async function loadPendingActivations() {
        const container = document.getElementById('pendingActivationsContainer');
        const { data: pData } = await _supabase.from('payments').select('*').eq('status', 'Pending');
        if (!pData || pData.length === 0) { container.innerHTML = '<p class="text-xs text-center py-4">No requests.</p>'; return; }
        container.innerHTML = '';
        for (let p of pData) {
            let uName = 'Unknown'; let uMob = '';
            try { const { data: u } = await _supabase.from('users').select('name, mobile').eq('user_id', p.user_id).maybeSingle(); if(u){ uName=u.name; uMob=u.mobile; } } catch(e){}
            container.innerHTML += `<div class="bg-[#0f172a] border border-blue-500/30 rounded-xl p-3 mb-2"><div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-700"><div><p class="text-sm font-bold text-white">${uName}</p><p class="text-[10px] text-blue-400 font-mono">${p.user_id}</p></div><span class="text-[9px] text-amber-400 font-bold uppercase bg-amber-400/10 px-2 rounded">${p.status}</span></div><div class="text-xs text-slate-300 font-mono mb-2 bg-slate-800 p-1.5 rounded"><span class="text-slate-500">UTR:</span> <strong class="text-emerald-400">${p.utr_number}</strong></div><div class="flex gap-2"><button onclick="approveActivation('${p.id}', '${p.user_id}')" class="flex-1 bg-blue-600 text-white py-1.5 rounded text-xs font-bold">Approve</button><button onclick="rejectActivation('${p.id}')" class="bg-red-600/20 text-red-400 px-3 py-1.5 rounded text-xs"><i class="fa-solid fa-xmark"></i></button></div></div>`;
        }
    }
    async function approveActivation(pid, uid) { if(confirm("Approve UTR and ACTIVE student?")) { await _supabase.from('payments').update({ status: 'Approved' }).eq('id', pid); await _supabase.from('users').update({ status: 'Active' }).eq('user_id', uid); loadPendingActivations(); fetchDashboardStats(); } }
    async function rejectActivation(pid) { if(confirm("Reject?")) { await _supabase.from('payments').update({ status: 'Rejected' }).eq('id', pid); loadPendingActivations(); } }

    async function loadPendingWithdrawals() {
        const container = document.getElementById('pendingWithdrawalsContainer');
        const { data: wData } = await _supabase.from('withdrawals').select('*').eq('status', 'Pending');
        if (!wData || wData.length === 0) { container.innerHTML = '<p class="text-xs text-center py-4">No payouts.</p>'; return; }
        container.innerHTML = '';
        for (let w of wData) {
            let uName = 'Unknown'; let uBank = 'No Bank Data';
            try { const { data: u } = await _supabase.from('users').select('name, bank_acc, bank_ifsc').eq('user_id', w.user_id).maybeSingle(); if(u){ uName=u.name; if(u.bank_acc) uBank=`A/C: ${u.bank_acc} | IFSC: ${u.bank_ifsc}`; } } catch(e){}
            container.innerHTML += `<div class="bg-[#0f172a] border border-emerald-500/30 rounded-xl p-3 mb-2"><div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-700"><div><p class="text-sm font-bold text-white">${uName}</p><p class="text-[10px] text-blue-400">${w.user_id}</p></div><p class="text-lg font-black text-emerald-400">₹${w.amount}</p></div><div class="text-[10px] text-slate-400 font-mono mb-2">${uBank}</div><button onclick="approveWithdrawal('${w.id}')" class="w-full bg-emerald-600 text-white py-1.5 rounded text-xs font-bold">Mark Paid</button></div>`;
        }
    }
    async function approveWithdrawal(wId) { if(confirm("Mark as Paid?")) { await _supabase.from('withdrawals').update({ status: 'Paid' }).eq('id', wId); loadPendingWithdrawals(); } }

    async function downloadFullDB() {
        const btn = document.getElementById('btnExcel'); btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>...';
        if (!allUsersData || allUsersData.length === 0) return;
        const networkMap = {}; allUsersData.forEach(u => { const sp = String(u.sponsor||'').trim().toUpperCase(); if(sp) { if(!networkMap[sp]) networkMap[sp]=[]; networkMap[sp].push(u); } });
        const payoutRates = [1000, 500, 250, 250, 250, 125, 125, 125, 125];
        const headers = ["User ID", "Name", "Mobile", "Password", "Status", "Sponsor ID", "Total Earning (Live)", "Bank Name", "A/C Number", "IFSC", "Join Date"];
        const csvRows = [headers.join(',')];
        allUsersData.forEach(u => {
            let earn = 0; 
            if((u.status||'').toLowerCase() === 'active') {
                let cLevel = networkMap[String(u.user_id).trim().toUpperCase()] || [];
                for (let i = 0; i < 9; i++) {
                    let actCount = cLevel.filter(x => (x.status||'').toLowerCase() === 'active').length; earn += actCount * payoutRates[i];
                    let nxLevel = []; cLevel.forEach(x => { nxLevel = nxLevel.concat(networkMap[String(x.user_id).trim().toUpperCase()] || []); }); cLevel = nxLevel;
                }
            }
            csvRows.push([ `"${u.user_id}"`, `"${u.name}"`, `"${u.mobile}"`, `"${u.password}"`, `"${u.status}"`, `"${u.sponsor}"`, `"${earn}"`, `"${u.bank_name||''}"`, `"${u.bank_acc||''}"`, `"${u.bank_ifsc||''}"`, `"${u.created_at ? new Date(u.created_at).toLocaleDateString('en-IN') : '-'}"` ].join(','));
        });
        triggerDownload(csvRows.join('\n'), `MAHAN_MasterDB.csv`); btn.innerHTML = '<i class="fa-solid fa-download mr-1"></i> Live Master CSV';
    }

    async function downloadBankPayoutList() {
        const { data: wData } = await _supabase.from('withdrawals').select('*').eq('status', 'Pending');
        if(!wData || wData.length === 0) { alert("No pending payouts!"); return; }
        const csvRows = [["Beneficiary Name", "Account Number", "IFSC Code", "Amount", "User ID"].join(',')];
        for (let w of wData) {
            const { data: uData } = await _supabase.from('users').select('name, bank_acc, bank_ifsc').eq('user_id', w.user_id).maybeSingle();
            csvRows.push([ `"${uData?.name||'Unknown'}"`, `"${uData?.bank_acc||''}"`, `"${uData?.bank_ifsc||''}"`, `"${w.amount}"`, `"${w.user_id}"` ].join(','));
        }
        triggerDownload(csvRows.join('\n'), `Bank_Payouts.csv`);
    }

    function triggerDownload(csvContent, filename) { const a = document.createElement('a'); a.href = window.URL.createObjectURL(new Blob([csvContent], { type: 'text/csv' })); a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); }
</script>
</body>
</html>
