<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHAN - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-red-600 text-white font-bold px-3 py-2 rounded-lg text-lg">ADMIN</div>
            <div>
                <h1 class="text-sm font-bold tracking-wide">MAHAN Master Panel</h1>
                <p class="text-xs text-slate-400">Manage All Registered Users</p>
            </div>
        </div>
        <button onclick="logout()" class="bg-red-600/20 text-red-400 border border-red-500/50 hover:bg-red-600 hover:text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">
            <i class="fa-solid fa-power-off"></i> Logout
        </button>
    </header>

    <main class="flex-grow p-4 max-w-6xl mx-auto w-full space-y-6 py-8">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl">
            <h2 class="text-lg font-bold mb-4 flex items-center"><i class="fa-solid fa-users text-emerald-400 mr-2"></i> All Registered Users</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-900 uppercase text-slate-400 border-b border-slate-700">
                        <tr>
                            <th class="p-3">User ID</th>
                            <th class="p-3">Name</th>
                            <th class="p-3">Mobile</th>
                            <th class="p-3">Sponsor</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y divide-slate-700">
                        <tr><td colspan="5" class="p-4 text-center text-slate-500">Loading users from database...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="bg-slate-800 border-t border-slate-700 p-4 text-center text-xs text-slate-400">
        &copy; 2026 MAHAN - The Institute Of English. All Rights Reserved.
    </footer>

    <script>
        const SUPABASE_URL = "https://wzrbsvwmrymkpzwmgypb.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cmJzdndtcnlta3B6d21neXBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDc1NzQsImV4cCI6MjEwMzMyMzU3NH0.5ulY5LW3AQEPFDP__iOSJssgNafTSe9Yu4gEqZF7sLc";
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchUsers() {
            const { data, error } = await _supabase.from('users').select('*').order('id', { ascending: false });
            const tbody = document.getElementById('userTableBody');
            if(error) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-400">Error loading data: ${error.message}</td></tr>`;
                return;
            }
            if(!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">No users found in database.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(user => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-750">
                        <td class="p-3 font-bold text-emerald-400">${user.user_id}</td>
                        <td class="p-3">${user.name}</td>
                        <td class="p-3">${user.mobile}</td>
                        <td class="p-3">${user.sponsor || '-'}</td>
                        <td class="p-3"><span class="bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded text-[10px] font-semibold">${user.status}</span></td>
                    </tr>
                `;
            });
        }

        fetchUsers();

        function logout() {
            localStorage.removeItem('mahan_user');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
