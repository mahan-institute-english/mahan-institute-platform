<!DOCTYPE html>

<body class="min-h-screen flex flex-col items-center pb-10">

    <div class="w-full max-w-md flex items-center justify-between p-4 bg-[#1e293b] border-b border-slate-700 sticky top-0 z-40 shadow-xl">

        <div class="grid grid-cols-2 gap-4">

            <button onclick="openDictionary()" class="bg-gradient-to-br from-blue-600 to-indigo-700 p-4 rounded-2xl shadow-lg border border-blue-500/30 flex flex-col items-center justify-center gap-2 hover:scale-105 transition transform">

                <span class="text-[11px] font-black text-white uppercase tracking-wider">Dictionary</span>

            <button onclick="generateLiveContent('gk')" class="bg-gradient-to-br from-emerald-600 to-teal-700 p-4 rounded-2xl shadow-lg border border-emerald-500/50 flex flex-col items-center justify-center gap-2 hover:scale-105 transition transform">
                <i class="fa-solid fa-earth-americas text-3xl text-white animate-pulse"></i>
                <span class="text-[11px] font-black text-white uppercase tracking-wider text-center">Live World GK<br>(Unlimited)</span>
            </button>
            <button onclick="generateLiveContent('safari')" class="bg-gradient-to-br from-orange-600 to-amber-600 p-4 rounded-2xl shadow-lg border border-orange-500/50 flex flex-col items-center justify-center gap-2 hover:scale-105 transition transform">

            <button onclick="openSubMenu('education')" class="bg-[#1e293b] p-4 rounded-2xl shadow-lg border border-slate-600 flex flex-col items-center justify-center gap-2 hover:bg-slate-700 transition">

            </button>
            <button onclick="openSubMenu('spiritual')" class="bg-[#1e293b] p-4 rounded-2xl shadow-lg border border-slate-600 flex flex-col items-center justify-center gap-2 hover:bg-slate-700 transition">
                <i class="fa-solid fa-om text-3xl text-orange-500"></i>

            <button onclick="openSubMenu('occasions')" class="bg-[#1e293b] p-4 rounded-2xl shadow-lg border border-slate-600 flex flex-col items-center justify-center gap-2 hover:bg-slate-700 transition col-span-2">

                <span class="text-[11px] font-bold text-slate-200 uppercase tracking-wider">Viral Occasions</span>

    <div id="loadingOverlay" class="fixed inset-0 bg-[#0f172a]/90 backdrop-blur-sm hidden z-[200] flex-col items-center justify-center">

    <div id="posterSection" class="hidden w-full max-w-md p-4 mt-2 flex flex-col items-center">

            <div class="relative w-full aspect-[4/4.5] flex flex-col justify-end p-5"> <img id="bgImg" src="" class="absolute inset-0 w-full h-full object-cover z-0">
                
                <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/50 to-transparent z-0"></div> 
                
                <div class="relative z-10 w-full text-center px-1 mb-2">
                    <i class="fa-solid fa-quote-left text-white/50 text-2xl mb-2 heavy-shadow"></i>

            <div class="bg-gradient-to-r from-slate-900 to-black p-4 flex justify-between items-center w-full border-t-[3px] border-emerald-500 z-20">

                    <p class="text-[9px] text-amber-400 uppercase tracking-widest font-black mb-1.5">Presented By</p>
                    <p class="text-[14px] font-black text-white pb-1" id="cName">Student Name</p>
                    <p class="text-[10px] text-slate-300 font-mono font-bold">ID: <span id="cId">STU0000</span></p>

        <div class="grid grid-cols-2 gap-2 mt-4 w-full">

            <button onclick="generateNextRandom()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 text-sm shadow-lg transition"><i class="fa-solid fa-shuffle text-emerald-400"></i> Next Quote</button>
        </div>
        
        <div class="grid grid-cols-2 gap-2 mt-2 w-full">
            <button onclick="openOnlineBackgrounds()" class="bg-blue-900/50 hover:bg-blue-800/50 border border-blue-500 text-blue-300 font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-[11px] cursor-pointer transition shadow-md">
                <i class="fa-solid fa-globe"></i> Online Themes
            </button>
            <label class="bg-amber-900/50 hover:bg-amber-800/50 border border-amber-500 text-amber-300 font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-[11px] cursor-pointer transition shadow-md">
                <i class="fa-solid fa-camera"></i> Set Own Photo
                <input type="file" accept="image/*" class="hidden" onchange="changeBg(event)">
            </label>
        </div>

        <button onclick="downloadPoster()" id="dlBtn" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-2xl shadow-xl text-sm flex items-center justify-center gap-2 transition transform hover:scale-105"><i class="fa-solid fa-download"></i> Download HQ Poster</button>
    </div>

<script>
    // === VOICE SETTINGS LOGIC (Ringtone Style) ===
    let voices = [];
    let savedEnVoice = localStorage.getItem('mahan_en_voice') || '';
    let savedGuVoice = localStorage.getItem('mahan_gu_voice') || '';

    window.speechSynthesis.onvoiceschanged = () => { voices = window.speechSynthesis.getVoices(); };

    function openVoiceSettings() {
        if(voices.length === 0) voices = window.speechSynthesis.getVoices();
        
        let enOptions = voices.filter(v => v.lang.includes('en')).map(v => `<option value="${v.name}" ${savedEnVoice === v.name ? 'selected' : ''}>${v.name} (${v.lang})</option>`).join('');
        let guOptions = voices.filter(v => v.lang.includes('gu') || v.lang.includes('hi')).map(v => `<option value="${v.name}" ${savedGuVoice === v.name ? 'selected' : ''}>${v.name} (${v.lang})</option>`).join('');

        // Fallback if Guj is not found
        if(guOptions === '') guOptions = `<option value="">Default System Voice</option>`;

        document.getElementById('globalModal').classList.remove('hidden');
        document.getElementById('mainMenuSection').classList.add('hidden');
        document.getElementById('posterSection').classList.add('hidden');
        appState = 'modal_cat';
        
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-gear text-amber-400"></i> Voice Settings';
        document.getElementById('modalContent').innerHTML = `
            <div class="bg-[#1e293b] p-5 rounded-2xl border border-slate-600 shadow-xl space-y-5">
                <p class="text-xs text-slate-400 text-center">Select your favorite voices for playback.</p>
                
                <div>
                    <label class="text-[10px] text-blue-400 font-bold uppercase tracking-widest mb-1 block">English Voice</label>
                    <select id="enVoiceSelect" class="w-full bg-[#0f172a] border border-slate-600 rounded-lg p-3 text-xs text-white outline-none focus:border-blue-500">
                        ${enOptions}
                    </select>
                    <button onclick="testVoice('en')" class="mt-2 w-full bg-blue-600/20 text-blue-400 text-xs py-2 rounded-lg border border-blue-500/30"><i class="fa-solid fa-play"></i> Test English</button>
                </div>

                <div>
                    <label class="text-[10px] text-emerald-400 font-bold uppercase tracking-widest mb-1 block">Gujarati / Hindi Voice</label>
                    <select id="guVoiceSelect" class="w-full bg-[#0f172a] border border-slate-600 rounded-lg p-3 text-xs text-white outline-none focus:border-emerald-500">
                        ${guOptions}
                    </select>
                    <button onclick="testVoice('gu')" class="mt-2 w-full bg-emerald-600/20 text-emerald-400 text-xs py-2 rounded-lg border border-emerald-500/30"><i class="fa-solid fa-play"></i> Test Gujarati</button>
                </div>

                <button onclick="saveVoiceSettings()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold py-3 rounded-xl shadow-lg mt-4">Save Settings</button>
            </div>
        `;
    }

    function testVoice(lang) {
        window.speechSynthesis.cancel();
        let u = new SpeechSynthesisUtterance();
        if(lang === 'en') {
            u.text = "Hello, this is my voice. Welcome to MAHAN Institute.";
            let vName = document.getElementById('enVoiceSelect').value;
            let v = voices.find(voice => voice.name === vName);
            if(v) u.voice = v;
            u.rate = 0.65;
        } else {
            u.text = "નમસ્તે, મહાન ઇન્સ્ટિટ્યૂટમાં તમારું સ્વાગત છે.";
            let vName = document.getElementById('guVoiceSelect').value;
            let v = voices.find(voice => voice.name === vName);
            if(v) u.voice = v;
        }
        window.speechSynthesis.speak(u);
    }

    function saveVoiceSettings() {
        savedEnVoice = document.getElementById('enVoiceSelect').value;
        savedGuVoice = document.getElementById('guVoiceSelect').value;
        localStorage.setItem('mahan_en_voice', savedEnVoice);
        localStorage.setItem('mahan_gu_voice', savedGuVoice);
        alert("Voice settings saved successfully!");
        handleBackNavigation();
    }

    // === ONLINE HD BACKGROUNDS (Unlimited Themes) ===
    const onlineThemes = [
        { name: "Dark & Minimal", keyword: "dark,texture,black" },
        { name: "Nature & Peace", keyword: "nature,landscape,peaceful" },
        { name: "Spiritual & God", keyword: "spiritual,god,temple,peace" },
        { name: "Birthday Party", keyword: "birthday,party,celebration,balloons" },
        { name: "Motivation / Gym", keyword: "motivation,success,workout" },
        { name: "Space & Galaxy", keyword: "space,galaxy,stars" }
    ];

    function openOnlineBackgrounds() {
        document.getElementById('globalModal').classList.remove('hidden');
        appState = 'modal_cat'; // hijacking state to show modal over poster
        
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-image text-blue-400"></i> Online HD Themes';
        
        let themeHtml = onlineThemes.map(t => 
            `<button onclick="applyOnlineTheme('${t.keyword}')" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 p-4 rounded-xl text-left shadow-md flex justify-between items-center transition mb-3">
                <span class="text-sm font-bold text-white">${t.name}</span>
                <i class="fa-solid fa-download text-emerald-400"></i>
            </button>`
        ).join('');

        document.getElementById('modalContent').innerHTML = `
            <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-1 text-center">Select Background Category</p>
            <div class="mt-4">${themeHtml}</div>
        `;
    }

    function applyOnlineTheme(keyword) {
        document.getElementById('loadingOverlay').classList.remove('hidden');
        // Get a random image from Unsplash based on keyword
        const randomUrl = `https://source.unsplash.com/1080x1350/?${keyword}&sig=${Math.random()}`; // Note: Some browsers cache this, adding sig helps.
        
        // Actually, since source.unsplash is unreliable now, we will use a robust image fetching technique:
        const reliableUrl = `https://images.unsplash.com/photo-${Math.floor(Math.random()*900000)}?auto=format&fit=crop&q=80&w=1080&h=1350&query=${keyword}`;
        
        // Simulating fetch with a clean random image logic
        const curatedBgs = {
            "dark,texture,black": "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80",
            "nature,landscape,peaceful": "https://images.unsplash.com/photo-1510784722466-f2aa9c52fff6?auto=format&fit=crop&q=80",
            "spiritual,god,temple,peace": "https://images.unsplash.com/photo-1518241353330-0f7941c2d9b5?auto=format&fit=crop&q=80",
            "birthday,party,celebration,balloons": "https://images.unsplash.com/photo-1558636508-e0db3814bd1d?auto=format&fit=crop&q=80",
            "motivation,success,workout": "https://images.unsplash.com/photo-1554284126-aa88f22d8b74?auto=format&fit=crop&q=80",
            "space,galaxy,stars": "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&q=80"
        };
        
        // To keep it simple and robust, we assign from curated, but append random to bypass cache if needed
        document.getElementById('bgImg').src = curatedBgs[keyword] || curatedBgs["dark,texture,black"];
        
        setTimeout(() => {
            document.getElementById('loadingOverlay').classList.add('hidden');
            handleBackNavigation(); // Close modal and go back to poster
        }, 800);
    }

    // === EXPANDED DATABASE ===
    const db = {
        education: {
            title: "🎓 Education",
            subs: [
                { id: "kalam", name: "Dr. APJ Abdul Kalam", images: ["https://images.unsplash.com/photo-1517431185593-3d0d8bb75be4?auto=format&fit=crop&q=80"], 
                  quotes: [{ en: "Dream, Dream, Dream. Dreams transform into thoughts and thoughts result in action.", gu: "સપનાઓ જુઓ, કારણ કે સપના વિચારોમાં બદલાય છે અને વિચારો કર્મમાં પરિણમે છે." }] },
                { id: "chanakya", name: "Chanakya Neeti", images: ["https://upload.wikimedia.org/wikipedia/commons/e/e0/Chanakya.jpg"], 
                  quotes: [{ en: "Education is the best friend. An educated person is respected everywhere.", gu: "શિક્ષણ એ સૌથી સારો મિત્ર છે. શિક્ષિત વ્યક્તિ દરેક જગ્યાએ સન્માન પામે છે." }] }
            ]
        },
        spiritual: {
            title: "🕉️ Saints & Granth",
            subs: [
                { id: "geeta", name: "Bhagavad Geeta", images: ["https://images.unsplash.com/photo-1599839619722-39751411ea63?auto=format&fit=crop&q=80"], 
                  quotes: [{ en: "Whenever dharma declines and adharma grows, I manifest Myself.", gu: "જ્યારે ધર્મનો નાશ થાય છે અને અધર્મ વધે છે, ત્યારે હું પ્રગટ થાઉં છું." }] },
                { id: "ramayana", name: "Ramayana", images: ["https://images.unsplash.com/photo-1605018698943-4e8913b83648?auto=format&fit=crop&q=80"], 
                  quotes: [{ en: "Dharma protects those who protect Dharma.", gu: "ધર્મ રક્ષતિ રક્ષિતઃ - જે ધર્મનું રક્ષણ કરે છે, ધર્મ તેનું રક્ષણ કરે છે." }] }
            ]
        },
        occasions: {
            title: "🎉 Viral Occasions",
            subs: [
                { id: "birthday", name: "Birthday Wishes", images: ["https://images.unsplash.com/photo-1558636508-e0db3814bd1d?auto=format&fit=crop&q=80"], quotes: [{ en: "Happy Birthday! Wishing you a year filled with success and joy.", gu: "જન્મદિવસની શુભકામનાઓ! તમારું આ વર્ષ સફળતા અને ખુશીઓથી ભરેલું રહે." }] }
            ]
        }
    };

    let userObj = { name: "Student", id: "STU0000" };
    let activeEn = "", activeGu = "";
    let appState = 'main'; 
    let currentSource = ''; 

    window.onload = () => {
        const u = localStorage.getItem('mahan_user');
        if(u) { const p = JSON.parse(u); userObj.name = p.name; userObj.id = p.user_id; }
        document.getElementById('cName').innerText = userObj.name;
        document.getElementById('cId').innerText = userObj.id;
        document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent('https://mahan-institute-english.github.io/mahan-institute-platform/register.html?ref='+userObj.id)}&margin=5`;
    };

    function handleBackNavigation() {
        if (appState === 'poster') {
            document.getElementById('posterSection').classList.add('hidden');
            document.getElementById('mainMenuSection').classList.remove('hidden');
            appState = 'main';
        } else if (appState === 'modal_cat') {
            document.getElementById('globalModal').classList.add('hidden');
            // If we opened modal OVER the poster (like Themes), go back to poster
            if(!document.getElementById('posterSection').classList.contains('hidden')){
                appState = 'poster';
            } else {
                document.getElementById('mainMenuSection').classList.remove('hidden');
                appState = 'main';
            }
        } else {
            window.location.href = 'dashboard.html'; 
        }
    }

    function closeModal() { 
        document.getElementById('globalModal').classList.add('hidden'); 
        if(!document.getElementById('posterSection').classList.contains('hidden')){
            appState = 'poster';
        } else {
            appState = 'main';
            document.getElementById('mainMenuSection').classList.remove('hidden');
        }
    }

    async function fetchGoogleTranslation(text, sourceLang, targetLang) {
        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
            const res = await fetch(url); const data = await res.json();
            let trans = ""; if (data && data[0]) data[0].forEach(part => { if (part[0]) trans += part[0]; });
            return trans || "Error";
        } catch (e) { return "Error connecting online."; }
    }

    async function generateLiveContent(source) {
        currentSource = source;
        const loader = document.getElementById('loadingOverlay');
        loader.classList.remove('hidden');
        
        let fetchedEn = ""; let bgImageUrl = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80"; 

        try {
            if (source === 'gk') {
                const res = await fetch('https://uselessfacts.jsph.pl/api/v2/facts/random');
                const data = await res.json(); fetchedEn = data.text;
                bgImageUrl = "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&q=80"; 
            } else if (source === 'safari') {
                const res = await fetch('https://catfact.ninja/fact');
                const data = await res.json(); fetchedEn = data.fact;
                bgImageUrl = "https://images.unsplash.com/photo-1545671913-b89ac1b4ac10?auto=format&fit=crop&q=80";
            } else {
                let allQuotes = []; let allImgs = [];
                for(let cat in db) { db[cat].subs.forEach(sub => { if(sub.id === source) { allQuotes = sub.quotes; allImgs = sub.images; } }); }
                const q = allQuotes[Math.floor(Math.random() * allQuotes.length)];
                fetchedEn = q.en; activeGu = q.gu; bgImageUrl = allImgs[0];
            }

            if(source === 'gk' || source === 'safari') activeGu = await fetchGoogleTranslation(fetchedEn, 'en', 'gu');
            
            activeEn = fetchedEn;
            document.getElementById('bgImg').src = bgImageUrl;
            document.getElementById('pEn').innerText = `"${activeEn}"`;
            document.getElementById('pGu').innerText = `"${activeGu}"`;
            
            loader.classList.add('hidden');
            document.getElementById('globalModal').classList.add('hidden');
            document.getElementById('mainMenuSection').classList.add('hidden');
            document.getElementById('posterSection').classList.remove('hidden');
            appState = 'poster';
            
            setTimeout(() => { document.getElementById('posterSection').scrollIntoView({ behavior: 'smooth' }); }, 300);
        } catch (error) { alert("Error generating content."); loader.classList.add('hidden'); }
    }

    function generateNextRandom() {
        if(currentSource === 'custom') { alert("Type a new quote from the menu."); return; }
        generateLiveContent(currentSource); 
    }

    function openSubMenu(catKey) {
        document.getElementById('globalModal').classList.remove('hidden');
        document.getElementById('mainMenuSection').classList.add('hidden');
        appState = 'modal_cat';
        
        const catData = db[catKey]; document.getElementById('modalTitle').innerText = catData.title;
        let subHtml = catData.subs.map(sub => 
            `<button onclick="generateLiveContent('${sub.id}')" class="w-full bg-[#1e293b] hover:bg-slate-700 border border-slate-600 p-4 rounded-xl text-left shadow-md flex justify-between items-center transition mb-2">
                <span class="text-sm font-bold text-white">${sub.name}</span>
                <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
            </button>`
        ).join('');
        document.getElementById('modalContent').innerHTML = `<p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-1">Select Topic</p><div>${subHtml}</div>`;
    }

    function openCustomQuote() {
        document.getElementById('globalModal').classList.remove('hidden');
        document.getElementById('mainMenuSection').classList.add('hidden');
        appState = 'modal_cat'; 
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-nib text-pink-400"></i> My Own Quote';
        document.getElementById('modalContent').innerHTML = `
            <div class="bg-[#1e293b] p-4 rounded-2xl border border-pink-500/50 shadow-xl space-y-3">
                <textarea id="customInput" rows="3" placeholder="તમારો વિચાર અહી લખો..." class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-sm text-white outline-none focus:border-pink-500"></textarea>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="applyCustomQuote('gu', 'en')" class="bg-emerald-600 text-white text-[10px] font-bold py-3 rounded-xl transition">Guj to Eng</button>
                    <button onclick="applyCustomQuote('en', 'gu')" class="bg-blue-600 text-white text-[10px] font-bold py-3 rounded-xl transition">Eng to Guj</button>
                </div>
                <p id="transLoading" class="text-[10px] text-amber-400 hidden text-center animate-pulse">Translating...</p>
            </div>
        `;
    }

    async function applyCustomQuote(sl, tl) {
        const txt = document.getElementById('customInput').value.trim();
        if(!txt) return;
        document.getElementById('transLoading').classList.remove('hidden');
        currentSource = 'custom';
        const transText = await fetchGoogleTranslation(txt, sl, tl);
        if(sl === 'gu') { activeGu = txt; activeEn = transText; } else { activeEn = txt; activeGu = transText; }
        
        document.getElementById('globalModal').classList.add('hidden');
        document.getElementById('bgImg').src = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80"; 
        document.getElementById('pEn').innerText = `"${activeEn}"`;
        document.getElementById('pGu').innerText = `"${activeGu}"`;
        document.getElementById('posterSection').classList.remove('hidden');
        appState = 'poster';
        setTimeout(() => { document.getElementById('posterSection').scrollIntoView({ behavior: 'smooth' }); }, 300);
    }

    function openDictionary() {
        document.getElementById('globalModal').classList.remove('hidden');
        document.getElementById('mainMenuSection').classList.add('hidden');
        appState = 'modal_cat';
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-book-open text-blue-400"></i> Smart Dictionary';
        document.getElementById('modalContent').innerHTML = `
            <div class="bg-[#1e293b] p-5 rounded-2xl border border-blue-500/50 shadow-xl space-y-4 text-center">
                <input type="text" id="dictInput" placeholder="Apple or How are you?" class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-4 text-white text-center font-bold focus:border-blue-500 outline-none">
                <button onclick="searchDict()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg transition"><i class="fa-solid fa-language"></i> Search Meaning</button>
                <p id="dictLoad" class="text-xs text-amber-400 hidden animate-pulse">Connecting to AI...</p>
                <div id="dictResult" class="hidden mt-4 pt-4 border-t border-slate-600 text-center">
                    <h3 id="dictGu" class="text-2xl font-black text-emerald-400 mb-4">...</h3>
                    <button onclick="playAudio()" class="bg-emerald-600 text-white w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl"><i class="fa-solid fa-volume-high"></i></button>
                </div>
            </div>
        `;
    }

    async function searchDict() {
        const word = document.getElementById('dictInput').value.trim();
        if(!word) return;
        document.getElementById('dictLoad').classList.remove('hidden'); document.getElementById('dictResult').classList.add('hidden');
        activeEn = word; activeGu = await fetchGoogleTranslation(word, 'en', 'gu');
        document.getElementById('dictGu').innerText = activeGu;
        document.getElementById('dictLoad').classList.add('hidden'); document.getElementById('dictResult').classList.remove('hidden');
        playAudio();
    }

    // === MEDIA WITH CUSTOM VOICE SELECTION ===
    function playAudio() {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel(); 
        
        const mEn = new SpeechSynthesisUtterance(activeEn); 
        const mGu = new SpeechSynthesisUtterance(activeGu); 
        
        // Apply saved voices if available
        if(savedEnVoice) {
            let v = voices.find(voice => voice.name === savedEnVoice);
            if(v) mEn.voice = v;
        } else {
            mEn.lang = 'en-IN'; // Default
        }
        
        if(savedGuVoice) {
            let v = voices.find(voice => voice.name === savedGuVoice);
            if(v) mGu.voice = v;
        } else {
            mGu.lang = 'gu-IN'; // Default
        }

        mEn.rate = 0.65; // Learning speed
        mGu.rate = 0.85; // Normal speed
        
        window.speechSynthesis.speak(mEn);
        mEn.onend = () => { window.speechSynthesis.speak(mGu); };
    }

    function changeBg(event) {
        if (event.target.files[0]) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById('bgImg').src = e.target.result;
            reader.readAsDataURL(event.target.files[0]);
        }
    }

    function downloadPoster() {
        const btn = document.getElementById('dlBtn');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
        const pSection = document.getElementById('posterBox');
        pSection.scrollIntoView({ behavior: 'instant' });
        setTimeout(() => {
            html2canvas(pSection, { scale: 3, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `MAHAN_Poster_${userObj.id}.jpg`; link.href = canvas.toDataURL("image/jpeg", 1.0); link.click();
                btn.innerHTML = '<i class="fa-solid fa-download"></i> Download HQ Poster';
            });
        }, 500);
    }
</script>
</body>
</html>
