<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHAN STUDIO - Deep AI Universe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow-x: hidden; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .modal-enter { animation: modalIn 0.3s ease-out forwards; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .heavy-shadow { text-shadow: 2px 2px 5px rgba(0,0,0,1), -1px -1px 4px rgba(0,0,0,0.8), 0px 4px 10px rgba(0,0,0,0.9); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-10">

    <!-- Header -->
    <div class="w-full max-w-md flex items-center justify-between p-4 bg-[#1e293b] border-b border-slate-700 sticky top-0 z-40 shadow-xl">
        <button onclick="window.location.href='dashboard.html'" class="text-slate-300 hover:text-white text-xl"><i class="fa-solid fa-arrow-left"></i></button>
        <h1 class="text-base font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-widest"><i class="fa-solid fa-microchip text-blue-500 mr-1 animate-pulse"></i> MAHAN STUDIO</h1>
        <div class="w-6"></div>
    </div>

    <!-- MAIN DASHBOARD MENU -->
    <div class="w-full max-w-md p-4 mt-2">
        <h2 class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-4 text-center">Select Category</h2>
        
        <div class="grid grid-cols-2 gap-4">
            <!-- Custom & Dictionary -->
            <button onclick="openCustomQuote()" class="bg-gradient-to-br from-pink-600 to-purple-700 p-4 rounded-2xl shadow-lg border border-pink-500/30 flex flex-col items-center justify-center gap-2 hover:scale-105 transition transform">
                <i class="fa-solid fa-pen-nib text-3xl text-white"></i>
                <span class="text-[11px] font-black text-white uppercase tracking-wider">My Own Quote</span>
            </button>
            <button onclick="openDictionary()" class="bg-gradient-to-br from-blue-600 to-indigo-700 p-4 rounded-2xl shadow-lg border border-blue-500/30 flex flex-col items-center justify-center gap-2 hover:scale-105 transition transform">
                <i class="fa-solid fa-book-open text-3xl text-white"></i>
                <span class="text-[11px] font-black text-white uppercase tracking-wider">Dictionary</span>
            </button>

            <!-- LIVE INTERNET API BUTTON -->
            <button onclick="fetchLiveInternetData('gk')" class="bg-gradient-to-br from-emerald-600 to-teal-700 p-4 rounded-2xl shadow-lg border border-emerald-500/50 flex flex-col items-center justify-center gap-2 hover:scale-105 transition transform col-span-2">
                <i class="fa-solid fa-earth-americas text-3xl text-white animate-pulse"></i>
                <span class="text-[11px] font-black text-white uppercase tracking-wider">Live World GK (Unlimited)</span>
                <span class="text-[8px] text-emerald-200">Fetches random facts from Global Servers</span>
            </button>

            <!-- Static Categories (Will be moved to JSON later) -->
            <button onclick="openCategory('education')" class="bg-[#1e293b] p-4 rounded-2xl shadow-lg border border-slate-600 flex flex-col items-center justify-center gap-2 hover:bg-slate-700 transition">
                <i class="fa-solid fa-graduation-cap text-3xl text-emerald-400"></i>
                <span class="text-[11px] font-bold text-slate-200 uppercase tracking-wider">Education</span>
            </button>
            <button onclick="openCategory('spiritual')" class="bg-[#1e293b] p-4 rounded-2xl shadow-lg border border-slate-600 flex flex-col items-center justify-center gap-2 hover:bg-slate-700 transition">
                <i class="fa-solid fa-om text-3xl text-orange-500"></i>
                <span class="text-[10px] font-bold text-slate-200 uppercase tracking-wider text-center">Saints & Granth</span>
            </button>
        </div>
    </div>

    <!-- GLOBAL MODAL OVERLAY -->
    <div id="globalModal" class="fixed inset-0 bg-[#0f172a]/95 backdrop-blur-md hidden z-[100] flex-col items-center justify-start overflow-y-auto pb-10">
        <div class="w-full max-w-md p-4 flex justify-between items-center sticky top-0 bg-[#0f172a]/90 backdrop-blur-md z-[110] border-b border-slate-700">
            <h2 id="modalTitle" class="text-sm font-black text-white tracking-widest uppercase">Title</h2>
            <button onclick="closeModal()" class="w-8 h-8 bg-red-500/20 text-red-400 rounded-full flex justify-center items-center hover:bg-red-500 hover:text-white transition"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="w-full max-w-md p-4 w-full flex-1 modal-enter space-y-4" id="modalContent"></div>
    </div>

    <!-- LOADING SPINNER FOR LIVE FETCH -->
    <div id="loadingOverlay" class="fixed inset-0 bg-[#0f172a]/90 backdrop-blur-sm hidden z-[200] flex-col items-center justify-center">
        <i class="fa-solid fa-circle-notch fa-spin text-5xl text-emerald-500 mb-4"></i>
        <p class="text-emerald-400 font-bold tracking-widest animate-pulse text-sm text-center px-4">Connecting to Global Servers...<br><span class="text-[10px] text-slate-400">Fetching Data & Translating</span></p>
    </div>

    <!-- THE LIVE POSTER AREA -->
    <div id="posterSection" class="hidden w-full max-w-md p-4 mt-2 flex flex-col items-center">
        <h2 class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-2"><i class="fa-solid fa-circle text-red-500 animate-pulse text-[8px] mr-1"></i> Live Poster Preview</h2>
        
        <div id="posterBox" class="relative rounded-[1.5rem] shadow-2xl border-4 border-slate-600 overflow-hidden w-full aspect-[4/5] flex flex-col bg-slate-900">
            <img id="bgImg" src="" class="absolute inset-0 w-full h-full object-cover z-0">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80 z-0"></div>

            <div class="relative z-10 flex flex-col h-full justify-end p-4 pb-5">
                <div class="w-full text-center mb-6 px-2">
                    <i class="fa-solid fa-quote-left text-white/60 text-2xl mb-1 heavy-shadow"></i>
                    <h3 id="pEn" class="text-[15px] md:text-lg font-black text-white leading-snug heavy-shadow mb-3">"English Text"</h3>
                    <p id="pGu" class="text-[13px] md:text-base font-bold text-emerald-400 leading-snug heavy-shadow">"Gujarati Text"</p>
                </div>

                <div class="bg-black/85 backdrop-blur-md rounded-xl p-3 flex justify-between items-center w-full border border-white/20">
                    <div class="flex-1 pr-3 overflow-hidden">
                        <p class="text-[8px] text-amber-400 uppercase tracking-widest font-black mb-1">Presented By</p>
                        <p class="text-xs font-black text-white truncate pb-0.5" id="cName">Student Name</p>
                        <p class="text-[10px] text-slate-300 font-mono font-bold truncate">ID: <span id="cId">STU0000</span></p>
                    </div>
                    <img id="qrImg" src="" class="w-12 h-12 shrink-0 object-contain bg-white p-1 rounded-md">
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2 mt-4 w-full">
            <button onclick="playAudio()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-xs shadow-lg"><i class="fa-solid fa-volume-high"></i> Play Audio</button>
            <label class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-xs cursor-pointer shadow-lg">
                <i class="fa-solid fa-camera text-amber-400"></i> Change Photo
                <input type="file" accept="image/*" class="hidden" onchange="changeBg(event)">
            </label>
        </div>
        <button onclick="downloadPoster()" id="dlBtn" class="w-full mt-3 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-xl shadow-lg text-sm flex items-center justify-center gap-2"><i class="fa-solid fa-download"></i> Download HQ Poster</button>
    </div>

<script>
    // === STATIC DB (For Specific Categories like Geeta that need precise Sanskrit-Gujarati translation) ===
    const db = {
        education: {
            title: "🎓 Education",
            subs: [
                {
                    id: "kalam", name: "Dr. APJ Abdul Kalam",
                    images: ["https://upload.wikimedia.org/wikipedia/commons/thumb/b/b0/A._P._J._Abdul_Kalam_in_2008.jpg/800px-A._P._J._Abdul_Kalam_in_2008.jpg"],
                    quotes: [
                        { en: "Dream, Dream, Dream. Dreams transform into thoughts and thoughts result in action.", gu: "સપનાઓ જુઓ, કારણ કે સપના વિચારોમાં બદલાય છે અને વિચારો કર્મમાં પરિણમે છે." },
                    ]
                }
            ]
        },
        spiritual: {
            title: "🕉️ Saints & Dharm Granth",
            subs: [
                {
                    id: "geeta", name: "Bhagavad Geeta",
                    images: ["https://images.unsplash.com/photo-1599839619722-39751411ea63?auto=format&fit=crop&q=80", "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Krishna_and_arjuna_in_kurukshetra.jpg/800px-Krishna_and_arjuna_in_kurukshetra.jpg"],
                    quotes: [
                        { en: "Whenever dharma declines and adharma grows, I manifest Myself.", gu: "જ્યારે ધર્મનો નાશ થાય છે અને અધર્મ વધે છે, ત્યારે હું પ્રગટ થાઉં છું." },
                        { en: "You have the right to work, but never to the fruit of work.", gu: "તમારો અધિકાર માત્ર કર્મ કરવાનો છે, ફળની આશા રાખવાનો નહિ." },
                    ]
                },
                {
                    id: "ramayana", name: "Ramayana",
                    images: ["https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Rama_and_Sita.jpg/800px-Rama_and_Sita.jpg"],
                    quotes: [
                        { en: "Dharma protects those who protect Dharma.", gu: "ધર્મ રક્ષતિ રક્ષિતઃ - જે ધર્મનું રક્ષણ કરે છે, ધર્મ તેનું રક્ષણ કરે છે." },
                    ]
                }
            ]
        }
    };

    let userObj = { name: "Student", id: "STU0000" };
    let activeEn = "", activeGu = "";

    window.onload = () => {
        const u = localStorage.getItem('mahan_user');
        if(u) { const p = JSON.parse(u); userObj.name = p.name; userObj.id = p.user_id; }
        
        document.getElementById('cName').innerText = userObj.name;
        document.getElementById('cId').innerText = userObj.id;
        document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent('https://mahan-institute-english.github.io/mahan-institute-platform/register.html?ref='+userObj.id)}&margin=5`;
    };

    function closeModal() { document.getElementById('globalModal').classList.add('hidden'); }

    // === GOOGLE TRANSLATE API ===
    async function fetchGoogleTranslation(text, sourceLang, targetLang) {
        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
            const res = await fetch(url); const data = await res.json();
            let trans = "";
            if (data && data[0]) data[0].forEach(part => { if (part[0]) trans += part[0]; });
            return trans || "Error";
        } catch (e) { return "Error connecting online."; }
    }

    // === LIVE INTERNET API FETCHING (UNLIMITED DATA) ===
    // This connects to a public API, gets a random English fact, and translates it!
    async function fetchLiveInternetData(type) {
        const loader = document.getElementById('loadingOverlay');
        loader.classList.remove('hidden');
        
        try {
            let fetchedEnglishText = "";
            let bgImageUrl = "";

            if (type === 'gk') {
                // Free Public API for Random Facts
                const response = await fetch('https://uselessfacts.jsph.pl/api/v2/facts/random');
                const data = await response.json();
                fetchedEnglishText = data.text;
                bgImageUrl = "https://images.unsplash.com/photo-1516981879613-9f5da904015f?auto=format&fit=crop&q=80"; // Earth/Space background
            }

            // Translate the live internet data
            const translatedGujarati = await fetchGoogleTranslation(fetchedEnglishText, 'en', 'gu');
            
            activeEn = fetchedEnglishText; 
            activeGu = translatedGujarati;
            
            document.getElementById('bgImg').src = bgImageUrl;
            document.getElementById('pEn').innerText = `"${activeEn}"`;
            document.getElementById('pGu').innerText = `"${activeGu}"`;
            
            loader.classList.add('hidden');
            document.getElementById('posterSection').classList.remove('hidden');
            setTimeout(() => { document.getElementById('posterSection').scrollIntoView({ behavior: 'smooth' }); }, 300);

        } catch (error) {
            alert("Internet Connection Error. Please try again.");
            loader.classList.add('hidden');
        }
    }

    // === STATIC CATEGORIES (As before) ===
    function openCategory(catKey) {
        document.getElementById('globalModal').classList.remove('hidden');
        const catData = db[catKey];
        document.getElementById('modalTitle').innerText = catData.title;
        
        let subHtml = catData.subs.map(sub => 
            `<button onclick="openQuoteList('${catKey}', '${sub.id}')" class="w-full bg-[#1e293b] hover:bg-slate-700 border border-slate-600 p-4 rounded-xl text-left shadow-md flex justify-between items-center transition">
                <span class="text-sm font-bold text-white">${sub.name}</span>
                <i class="fa-solid fa-chevron-right text-slate-500"></i>
            </button>`
        ).join('');

        document.getElementById('modalContent').innerHTML = `
            <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-1">Select Topic</p>
            <div class="space-y-3">${subHtml}</div>
        `;
    }

    function openQuoteList(catKey, subId) {
        const subData = db[catKey].subs.find(s => s.id === subId);
        document.getElementById('modalTitle').innerText = subData.name;
        
        let quoteHtml = subData.quotes.map((q, index) => 
            `<div onclick="createPoster('${catKey}', '${subId}', ${index})" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 p-4 rounded-xl text-left shadow-md cursor-pointer transition mb-3">
                <p class="text-sm font-bold text-white mb-2">"${q.en}"</p>
                <p class="text-xs text-emerald-400">"${q.gu}"</p>
                <p class="text-[9px] text-amber-400 uppercase mt-2 font-bold tracking-widest text-right"><i class="fa-solid fa-wand-magic-sparkles"></i> Create Poster</p>
            </div>`
        ).join('');

        document.getElementById('modalContent').innerHTML = `
            <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-1">Select Quote</p>
            <div class="h-[70vh] overflow-y-auto hide-scroll pb-10">${quoteHtml}</div>
        `;
    }

    function createPoster(catKey, subId, quoteIndex) {
        closeModal();
        const subData = db[catKey].subs.find(s => s.id === subId);
        const quote = subData.quotes[quoteIndex];
        activeEn = quote.en; activeGu = quote.gu;
        
        const randImg = subData.images[Math.floor(Math.random() * subData.images.length)];
        
        document.getElementById('bgImg').src = randImg;
        document.getElementById('pEn').innerText = `"${activeEn}"`;
        document.getElementById('pGu').innerText = `"${activeGu}"`;
        
        document.getElementById('posterSection').classList.remove('hidden');
        setTimeout(() => { document.getElementById('posterSection').scrollIntoView({ behavior: 'smooth' }); }, 300);
    }

    // === CUSTOM QUOTE (Translation Tool) ===
    function openCustomQuote() {
        document.getElementById('globalModal').classList.remove('hidden');
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-nib text-pink-400"></i> My Own Quote';
        document.getElementById('modalContent').innerHTML = `
            <div class="bg-[#1e293b] p-4 rounded-2xl border border-pink-500/50 shadow-xl space-y-3">
                <p class="text-[10px] text-pink-400 uppercase font-bold tracking-widest">Type Your Quote</p>
                <textarea id="customInput" rows="3" placeholder="તમારો વિચાર અહી લખો..." class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-sm text-white outline-none focus:border-pink-500"></textarea>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="applyCustomQuote('gu', 'en')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold py-3 rounded-xl transition"><i class="fa-solid fa-language"></i> Guj to Eng</button>
                    <button onclick="applyCustomQuote('en', 'gu')" class="bg-blue-600 hover:bg-blue-500 text-white text-[10px] font-bold py-3 rounded-xl transition"><i class="fa-solid fa-language"></i> Eng to Guj</button>
                </div>
                <p id="transLoading" class="text-[10px] text-amber-400 hidden text-center animate-pulse">Translating online...</p>
            </div>
        `;
    }

    async function applyCustomQuote(sl, tl) {
        const txt = document.getElementById('customInput').value.trim();
        if(!txt) return;
        document.getElementById('transLoading').classList.remove('hidden');
        
        const translatedText = await fetchGoogleTranslation(txt, sl, tl);
        if(sl === 'gu') { activeGu = txt; activeEn = translatedText; } 
        else { activeEn = txt; activeGu = translatedText; }
        
        closeModal();
        document.getElementById('bgImg').src = "https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&fit=crop&q=80"; 
        document.getElementById('pEn').innerText = `"${activeEn}"`;
        document.getElementById('pGu').innerText = `"${activeGu}"`;
        document.getElementById('posterSection').classList.remove('hidden');
        setTimeout(() => { document.getElementById('poster, Section').scrollIntoView({ behavior: 'smooth' }); }, 300);
    }

    // === SMART DICTIONARY ===
    function openDictionary() {
        document.getElementById('globalModal').classList.remove('hidden');
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-book-open text-blue-400"></i> Smart Dictionary';
        document.getElementById('modalContent').innerHTML = `
            <div class="bg-[#1e293b] p-5 rounded-2xl border border-blue-500/50 shadow-xl space-y-4 text-center">
                <input type="text" id="dictInput" placeholder="e.g., Apple or How are you?" class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-4 text-white text-center font-bold focus:border-blue-500 outline-none">
                <button onclick="searchDict()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition"><i class="fa-solid fa-language"></i> Search Meaning</button>
                <p id="dictLoad" class="text-xs text-amber-400 hidden animate-pulse">Connecting to Google AI...</p>
                <div id="dictResult" class="hidden mt-4 pt-4 border-t border-slate-600 text-center">
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest mb-1">Gujarati Meaning</p>
                    <h3 id="dictGu" class="text-2xl font-black text-emerald-400 mb-4">...</h3>
                    <button onclick="playAudio()" class="bg-emerald-600 text-white w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl"><i class="fa-solid fa-volume-high"></i></button>
                </div>
            </div>
        `;
    }

    async function searchDict() {
        const word = document.getElementById('dictInput').value.trim();
        if(!word) return;
        document.getElementById('dictLoad').classList.remove('hidden'); document.getElementById('dictResult').classList.add('hidden');
        const translatedText = await fetchGoogleTranslation(word, 'en', 'gu');
        activeEn = word; activeGu = translatedText;
        document.getElementById('dictGu').innerText = activeGu;
        document.getElementById('dictLoad').classList.add('hidden'); document.getElementById('dictResult').classList.remove('hidden');
        playAudio();
    }

    // === MEDIA & EXPORT ===
    function playAudio() {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel(); 
        const mEn = new SpeechSynthesisUtterance(activeEn); mEn.lang = 'en-US'; mEn.rate = 0.9;
        const mGu = new SpeechSynthesisUtterance(activeGu); mGu.lang = 'gu-IN'; mGu.rate = 0.9;
        window.speechSynthesis.speak(mEn);
        mEn.onend = () => { window.speechSynthesis.speak(mGu); };
    }

    function changeBg(event) {
        if (event.target.files[0]) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById('bgImg').src = e.target.result;
            reader.readAsDataURL(event.target.files[0]);
        }
    }

    function downloadPoster() {
        const btn = document.getElementById('dlBtn');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
        const pSection = document.getElementById('posterBox');
        pSection.scrollIntoView({ behavior: 'instant' });
        setTimeout(() => {
            html2canvas(pSection, { scale: 3, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `MAHAN_Poster_${userObj.id}.jpg`; link.href = canvas.toDataURL("image/jpeg", 1.0); link.click();
                btn.innerHTML = '<i class="fa-solid fa-download"></i> Download HQ Poster';
            });
        }, 500);
    }
</script>
</body>
</html>
