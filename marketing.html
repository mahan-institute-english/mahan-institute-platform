<script>

            { en: "Tulsi, sweet words bring peace all around.", gu: "તુલસી મીઠે બચન તે સુખ ઉપજત ચહુ ઓર. - ગોસ્વામી તુલસીદાસ" },
            { en: "Arise, awake, and stop not till the goal is reached.", gu: "ઉઠો, જાગો અને ધ્યેય પ્રાપ્તિ સુધી મંડ્યા રહો. - સ્વામી વિવેકાનંદ" }
        ],
        safari: [
            { en: "Did you know? An octopus has three hearts and blue blood.", gu: "શું તમે જાણો છો? ઓક્ટોપસને ત્રણ હૃદય અને ભૂરું લોહી હોય છે." },
            { en: "Honey never spoils. 3000-year-old honey is still edible.", gu: "મધ ક્યારેય બગડતું નથી. 3000 વર્ષ જૂનું મધ પણ ખાવાલાયક હોય છે." }
        ],

            { en: "Mount Everest is the highest peak in the world.", gu: "માઉન્ટ એવરેસ્ટ દુનિયાનું સૌથી ઊંચું શિખર છે." },
            { en: "The Statue of Unity is the tallest statue in the world.", gu: "સ્ટેચ્યુ ઓફ યુનિટી વિશ્વની સૌથી ઊંચી પ્રતિમા છે." }
        ],

            { en: "Light travels at 299,792 kilometers per second.", gu: "પ્રકાશ સેકન્ડના 2,99,792 કિલોમીટરની ઝડપે મુસાફરી કરે છે." },
            { en: "Water expands by about 9% when it freezes into ice.", gu: "જ્યારે પાણી જામીને બરફ બને છે, ત્યારે તેનું કદ 9% જેટલું વધી જાય છે." }
        ],
        ias: [
            { en: "The Indian Constitution is the longest written constitution.", gu: "ભારતનું બંધારણ વિશ્વનું સૌથી લાંબુ અને વિગતવાર લિખિત બંધારણ છે." },
            { en: "Reserve Bank of India (RBI) was established on April 1, 1935.", gu: "ભારતીય રિઝર્વ બેંક (RBI) ની સ્થાપના 1 એપ્રિલ, 1935 ના રોજ થઈ હતી." }
        ]
    };

    const bgImages = [
        "https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&fit=crop&q=80",
        "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&q=80",
        "https://images.unsplash.com/photo-1599839619722-39751411ea63?auto=format&fit=crop&q=80",
        "https://images.unsplash.com/photo-1516981879613-9f5da904015f?auto=format&fit=crop&q=80",
        "https://images.unsplash.com/photo-1506744626753-1fa44f4a4df2?auto=format&fit=crop&q=80"
    ];

    let userObj = { name: "Student", id: "STU0000" };
    let activeEn = "", activeGu = "";

    window.onload = () => {
        const u = localStorage.getItem('mahan_user');
        if(u) { const p = JSON.parse(u); userObj.name = p.name; userObj.id = p.user_id; }
    };

    function closeModal() { document.getElementById('globalModal').classList.add('hidden'); }

    // === GOOGLE TRANSLATE API INTEGRATION (High Accuracy Fix) ===
    async function fetchGoogleTranslation(text, sourceLang, targetLang) {
        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            const data = await response.json();
            let translatedText = "";
            if (data && data[0]) {
                data[0].forEach(part => { if (part[0]) translatedText += part[0]; });
            }
            return translatedText || "Translation Error";
        } catch (error) {
            console.error(error);
            return "Error connected to translation server.";
        }
    }

    // === POP-UP MANAGER ===
    function openModal(type) {
        document.getElementById('globalModal').classList.remove('hidden');
        document.getElementById('globalModal').scrollTop = 0;
        const mc = document.getElementById('modalContent');
        
        if(type === 'dict') {
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-book-open text-blue-400"></i> Smart Dictionary';
            mc.innerHTML = `
                <div class="bg-[#1e293b] p-5 rounded-2xl border border-blue-500/50 shadow-xl space-y-4 text-center">
                    <p class="text-xs text-slate-300">Type an English word or sentence to find its true Gujarati meaning.</p>
                    <input type="text" id="dictInput" placeholder="e.g., Apple or How are you?" class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-4 text-white text-center font-bold focus:border-blue-500 outline-none">
                    <button onclick="searchDictionary()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition"><i class="fa-solid fa-language"></i> Search & Translate</button>
                    <p id="dictLoad" class="text-xs text-amber-400 hidden animate-pulse">Connecting to Google AI...</p>
                    
                    <div id="dictResult" class="hidden mt-4 pt-4 border-t border-slate-600 text-center">
                        <p class="text-[10px] text-slate-400 uppercase tracking-widest mb-1">Gujarati Meaning</p>
                        <h3 id="dictGu" class="text-2xl font-black text-emerald-400 mb-4">...</h3>
                        <button onclick="playDictAudio()" class="bg-emerald-600 hover:bg-emerald-500 text-white w-12 h-12 rounded-full shadow-xl flex items-center justify-center transition mx-auto text-xl"><i class="fa-solid fa-volume-high"></i></button>
                        <p class="text-[9px] text-slate-500 mt-2">Listen to pronunciation</p>
                    </div>
                </div>
            `;
        } 
        else if (type === 'myOwn') {
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-nib text-pink-400"></i> My Own Quote';
            mc.innerHTML = `
                <div class="bg-[#1e293b] p-4 rounded-2xl border border-pink-500/50 shadow-xl space-y-3">
                    <p class="text-[10px] text-pink-400 uppercase font-bold tracking-widest">Type Your Quote</p>
                    <textarea id="customInput" rows="3" placeholder="તમારો વિચાર અહી લખો..." class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-sm text-white outline-none focus:border-pink-500"></textarea>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="customTrans('gu', 'en')" class="bg-emerald-600 text-white text-[10px] font-bold py-3 rounded-xl"><i class="fa-solid fa-language"></i> Guj to Eng</button>
                        <button onclick="customTrans('en', 'gu')" class="bg-blue-600 text-white text-[10px] font-bold py-3 rounded-xl"><i class="fa-solid fa-language"></i> Eng to Guj</button>
                    </div>
                    <p id="transLoading" class="text-[10px] text-amber-400 hidden text-center animate-pulse">Translating...</p>
                </div>
                ${getPosterHTML('My Quote')}
            `;
            generateRandomPoster('myOwn');
        }
    }

    function openSubModal(categoryKey, title, subCats) {
        document.getElementById('globalModal').classList.remove('hidden');
        document.getElementById('globalModal').scrollTop = 0;
        document.getElementById('modalTitle').innerHTML = title;
        
        let subBtnHTML = subCats.map(sub => `<button onclick="generateRandomPoster('${categoryKey}')" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 py-2 px-3 rounded-lg text-xs font-bold transition">${sub}</button>`).join('');

        document.getElementById('modalContent').innerHTML = `
            <div class="bg-[#1e293b] p-3 rounded-2xl shadow-xl">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-2">Select Topic</p>
                <div class="flex flex-wrap gap-2">${subBtnHTML}</div>
            </div>
            ${getPosterHTML(title)}
        `;
        generateRandomPoster(categoryKey);
    }

    // === DICTIONARY LOGIC (Using Google API) ===
    async function searchDictionary() {
        const word = document.getElementById('dictInput').value.trim();
        if(!word) return;
        document.getElementById('dictLoad').classList.remove('hidden');
        document.getElementById('dictResult').classList.add('hidden');
        
        // Translate from English (en) to Gujarati (gu)
        const translatedText = await fetchGoogleTranslation(word, 'en', 'gu');
        activeEn = word; activeGu = translatedText;
        
        document.getElementById('dictGu').innerText = activeGu;
        document.getElementById('dictLoad').classList.add('hidden');
        document.getElementById('dictResult').classList.remove('hidden');
        playDictAudio();
    }

    function playDictAudio() {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel(); 
        const mEn = new SpeechSynthesisUtterance(activeEn); mEn.lang = 'en-US'; mEn.rate = 0.9;
        const mGu = new SpeechSynthesisUtterance(activeGu); mGu.lang = 'gu-IN'; mGu.rate = 0.9;
        window.speechSynthesis.speak(mEn);
        mEn.onend = () => { window.speechSynthesis.speak(mGu); };
    }

    // === CUSTOM QUOTE LOGIC (Using Google API) ===
    async function customTrans(sl, tl) {
        const txt = document.getElementById('customInput').value.trim();
        if(!txt) return;
        document.getElementById('transLoading').classList.remove('hidden');
        
        const translatedText = await fetchGoogleTranslation(txt, sl, tl);
        
        if(sl === 'gu') { activeGu = txt; activeEn = translatedText; } 
        else { activeEn = txt; activeGu = translatedText; }
        
        updatePosterText();
        document.getElementById('transLoading').classList.add('hidden');
    }

    // === POSTER GENERATION (Cropping Fix Applied) ===

                    <div class="flex-1 flex flex-col justify-center mb-3 mt-3">

                            <p id="pGu" class="text-xs md:text-sm font-bold text-emerald-400 leading-relaxed">ઉપર ટાઇપ કરો અથવા ટોપિક પસંદ કરો!</p>
                        </div>
                    </div>

                    <!-- Added mb-2 to lift the bottom box up slightly -->
                    <div class="bg-black/80 backdrop-blur-md rounded-xl p-3 flex justify-between items-center w-full border border-white/20 mb-2">
                        <div class="flex-1 pr-3 overflow-hidden">
                            <p class="text-[8px] text-amber-400 uppercase tracking-widest font-black mb-1">Presented By</p>
                            <p class="text-xs font-black text-white truncate pb-0.5">${userObj.name}</p>
                            <p class="text-[9px] text-slate-300 font-mono font-bold">ID: ${userObj.id}</p>
                        </div>
                        <img src="${qrUrl}" class="w-12 h-12 object-contain bg-white p-1 rounded-md">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 mt-2">
                <button onclick="playDictAudio()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-xs shadow-lg"><i class="fa-solid fa-volume-high"></i> Play Audio</button>
                <label class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-xs cursor-pointer shadow-lg">
                    <i class="fa-solid fa-camera text-amber-400"></i> Change Photo
                    <input type="file" accept="image/*" class="hidden" onchange="changeBg(event)">
                </label>
            </div>
            <button onclick="downloadPoster()" id="dlBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-xl shadow-lg text-sm flex items-center justify-center gap-2 mt-2"><i class="fa-solid fa-download"></i> Download HQ Poster</button>
        `;
    }

    function generateRandomPoster(catKey) {
        if(catKey !== 'myOwn') {
            const arr = db[catKey];
            const randItem = arr[Math.floor(Math.random() * arr.length)];
            activeEn = randItem.en; activeGu = randItem.gu;
        }
        document.getElementById('bgImg').src = bgImages[Math.floor(Math.random() * bgImages.length)];
        updatePosterText();
    }

    function updatePosterText() {
        if(document.getElementById('pEn')) {
            document.getElementById('pEn').innerText = `"${activeEn}"`;
            document.getElementById('pGu').innerText = `"${activeGu}"`;
        }
    }

    function changeBg(event) {
        if (event.target.files[0]) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById('bgImg').src = e.target.result;
            reader.readAsDataURL(event.target.files[0]);
        }
    }

    function downloadPoster() {
        const btn = document.getElementById('dlBtn');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
        
        // Scroll fix for mobile to prevent cropping
        document.getElementById('globalModal').scrollTop = 0;
        
        setTimeout(() => {
            html2canvas(document.getElementById('posterBox'), { scale: 3, useCORS: true, scrollY: 0 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `MAHAN_${userObj.id}.jpg`; link.href = canvas.toDataURL("image/jpeg", 1.0); link.click();
                btn.innerHTML = '<i class="fa-solid fa-download"></i> Download HQ Poster';
            });
        }, 300);
    }
</script>
</body>
</html>
