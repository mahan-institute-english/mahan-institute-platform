<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHAN STUDIO - World No.1 AI Universe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow-x: hidden; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .modal-enter { animation: modalIn 0.3s ease-out forwards; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        /* Ultra strong text shadow for crystal clear reading */
        .heavy-shadow { text-shadow: 2px 2px 4px rgba(0,0,0,1), -2px -2px 4px rgba(0,0,0,1), 0px 5px 15px rgba(0,0,0,1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-10">

    <!-- Header -->
    <div class="w-full max-w-md flex items-center justify-between p-4 bg-[#1e293b] border-b border-slate-700 sticky top-0 z-40 shadow-xl">
        <button onclick="handleBackNavigation()" class="text-slate-300 hover:text-white text-xl px-2 py-1 transition transform hover:scale-110"><i class="fa-solid fa-arrow-left"></i></button>
        <h1 class="text-[15px] font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-widest"><i class="fa-solid fa-microchip text-blue-500 mr-1 animate-pulse"></i> MAHAN STUDIO</h1>
        <div class="w-6"></div>
    </div>

    <!-- MAIN DASHBOARD MENU -->
    <div id="mainMenuSection" class="w-full max-w-md p-4 mt-2 transition-all duration-300">
        <h2 class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-4 text-center">Select Category</h2>
        
        <div class="grid grid-cols-2 gap-4">
            <!-- Custom & Dictionary -->
            <button onclick="openCustomQuote()" class="bg-gradient-to-br from-pink-600 to-purple-700 p-4 rounded-2xl shadow-lg border border-pink-500/30 flex flex-col items-center justify-center gap-2 hover:scale-105 transition transform">
                <i class="fa-solid fa-pen-nib text-3xl text-white"></i>
                <span class="text-[11px] font-black text-white uppercase tracking-wider">My Own Quote</span>
            </button>
            <button onclick="openDictionary()" class="bg-gradient-to-br from-blue-600 to-indigo-700 p-4 rounded-2xl shadow-lg border border-blue-500/30 flex flex-col items-center justify-center gap-2 hover:scale-105 transition transform">
                <i class="fa-solid fa-book-open text-3xl text-white"></i>
                <span class="text-[11px] font-black text-white uppercase tracking-wider">Dictionary</span>
            </button>

            <!-- LIVE API BUTTONS -->
            <button onclick="generateLiveContent('gk')" class="bg-gradient-to-br from-emerald-600 to-teal-700 p-4 rounded-2xl shadow-lg border border-emerald-500/50 flex flex-col items-center justify-center gap-2 hover:scale-105 transition transform">
                <i class="fa-solid fa-earth-americas text-3xl text-white animate-pulse"></i>
                <span class="text-[11px] font-black text-white uppercase tracking-wider text-center">Live World GK<br>(Unlimited)</span>
            </button>
            <button onclick="generateLiveContent('safari')" class="bg-gradient-to-br from-orange-600 to-amber-600 p-4 rounded-2xl shadow-lg border border-orange-500/50 flex flex-col items-center justify-center gap-2 hover:scale-105 transition transform">
                <i class="fa-solid fa-compass text-3xl text-white animate-pulse"></i>
                <span class="text-[11px] font-black text-white uppercase tracking-wider text-center">Safari Facts<br>(Unlimited)</span>
            </button>

            <!-- Expanded Sub-Categories -->
            <button onclick="openSubMenu('education')" class="bg-[#1e293b] p-4 rounded-2xl shadow-lg border border-slate-600 flex flex-col items-center justify-center gap-2 hover:bg-slate-700 transition">
                <i class="fa-solid fa-graduation-cap text-3xl text-blue-400"></i>
                <span class="text-[11px] font-bold text-slate-200 uppercase tracking-wider">Education</span>
            </button>
            <button onclick="openSubMenu('spiritual')" class="bg-[#1e293b] p-4 rounded-2xl shadow-lg border border-slate-600 flex flex-col items-center justify-center gap-2 hover:bg-slate-700 transition">
                <i class="fa-solid fa-om text-3xl text-orange-500"></i>
                <span class="text-[10px] font-bold text-slate-200 uppercase tracking-wider text-center">Granth & Saints</span>
            </button>
            <button onclick="openSubMenu('occasions')" class="bg-[#1e293b] p-4 rounded-2xl shadow-lg border border-slate-600 flex flex-col items-center justify-center gap-2 hover:bg-slate-700 transition col-span-2">
                <i class="fa-solid fa-cake-candles text-3xl text-pink-400"></i>
                <span class="text-[11px] font-bold text-slate-200 uppercase tracking-wider">Viral Occasions</span>
            </button>
        </div>
    </div>

    <!-- GLOBAL MODAL OVERLAY -->
    <div id="globalModal" class="fixed inset-0 bg-[#0f172a]/95 backdrop-blur-md hidden z-[100] flex-col items-center justify-start overflow-y-auto pb-10">
        <div class="w-full max-w-md p-4 flex justify-between items-center sticky top-0 bg-[#0f172a]/90 backdrop-blur-md z-[110] border-b border-slate-700">
            <button onclick="handleBackNavigation()" class="text-slate-300 hover:text-white text-xl px-2 py-1"><i class="fa-solid fa-arrow-left"></i></button>
            <h2 id="modalTitle" class="text-sm font-black text-white tracking-widest uppercase">Title</h2>
            <div class="w-6"></div>
        </div>
        <div class="w-full max-w-md p-4 w-full flex-1 modal-enter space-y-4" id="modalContent"></div>
    </div>

    <!-- LOADING SPINNER -->
    <div id="loadingOverlay" class="fixed inset-0 bg-[#0f172a]/90 backdrop-blur-sm hidden z-[200] flex-col items-center justify-center">
        <i class="fa-solid fa-circle-notch fa-spin text-5xl text-emerald-500 mb-4"></i>
        <p class="text-emerald-400 font-bold tracking-widest animate-pulse text-sm text-center px-4">Translating & Generating...<br><span class="text-[10px] text-slate-400">Please wait</span></p>
    </div>

    <!-- THE LIVE POSTER AREA -->
    <div id="posterSection" class="hidden w-full max-w-md p-4 mt-2 flex flex-col items-center">
        
        <!-- NEW POSTER UI: 100% CROP-SAFE DESIGN -->
        <div id="posterBox" class="relative rounded-[1.5rem] shadow-2xl border-2 border-slate-500 overflow-hidden w-full flex flex-col bg-[#0f172a]">
            
            <!-- TOP SECTION: Image + Quote -->
            <div class="relative w-full aspect-[4/4.5] flex flex-col justify-center items-center p-6">
                <img id="bgImg" src="" class="absolute inset-0 w-full h-full object-cover z-0">
                <div class="absolute inset-0 bg-black/65 z-0"></div> <!-- Dark Overlay -->
                
                <div class="relative z-10 w-full text-center px-1">
                    <i class="fa-solid fa-quote-left text-white/50 text-4xl mb-4 heavy-shadow"></i>
                    <h3 id="pEn" class="text-[17px] md:text-xl font-black text-white leading-relaxed mb-5 heavy-shadow">"English Text"</h3>
                    <p id="pGu" class="text-[14px] md:text-lg font-bold text-emerald-400 leading-relaxed heavy-shadow">"Gujarati Text"</p>
                </div>
            </div>

            <!-- BOTTOM SECTION: Solid Block with safe padding to prevent cropping -->
            <!-- Using p-5 for extra breathing room, and items-center to perfectly align text with QR -->
            <div class="bg-gradient-to-r from-slate-900 to-black p-5 flex justify-between items-center w-full border-t-[3px] border-emerald-500 z-20">
                <div class="flex flex-col justify-center pr-3">
                    <p class="text-[9px] text-amber-400 uppercase tracking-widest font-black mb-1.5">Presented By</p>
                    <p class="text-[15px] font-black text-white pb-1" id="cName">Student Name</p>
                    <p class="text-[11px] text-slate-300 font-mono font-bold">ID: <span id="cId">STU0000</span></p>
                </div>
                <img id="qrImg" src="" class="w-16 h-16 shrink-0 object-contain bg-white p-1.5 rounded-xl shadow-lg">
            </div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="grid grid-cols-2 gap-2 mt-5 w-full">
            <button onclick="playAudio()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 text-sm shadow-lg transition"><i class="fa-solid fa-volume-high"></i> Play Audio</button>
            <button onclick="generateNextRandom()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 text-sm shadow-lg transition"><i class="fa-solid fa-shuffle text-emerald-400"></i> Next Quote</button>
        </div>
        
        <label class="w-full mt-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 text-xs cursor-pointer transition shadow-md">
            <i class="fa-solid fa-camera text-amber-400"></i> Upload Custom Photo Background
            <input type="file" accept="image/*" class="hidden" onchange="changeBg(event)">
        </label>

        <button onclick="downloadPoster()" id="dlBtn" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-2xl shadow-xl text-sm flex items-center justify-center gap-2 transition transform hover:scale-105"><i class="fa-solid fa-download"></i> Download HQ Poster</button>
    </div>

<script>
    // Load voices early
    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

    // === EXPANDED DATABASE FOR UNLIMITED FEEL ===
    const db = {
        education: {
            title: "🎓 Education",
            subs: [
                { id: "kalam", name: "Dr. APJ Abdul Kalam", images: ["https://images.unsplash.com/photo-1517431185593-3d0d8bb75be4?auto=format&fit=crop&q=80"], 
                  quotes: [
                    { en: "Dream, Dream, Dream. Dreams transform into thoughts and thoughts result in action.", gu: "સપનાઓ જુઓ, કારણ કે સપના વિચારોમાં બદલાય છે અને વિચારો કર્મમાં પરિણમે છે." },
                    { en: "To succeed in your mission, you must have single-minded devotion to your goal.", gu: "તમારા મિશનમાં સફળ થવા માટે, તમારે તમારા ધ્યેય પ્રત્યે એકાગ્ર નિષ્ઠા હોવી જોઈએ." }
                  ] 
                },
                { id: "chanakya", name: "Chanakya Neeti", images: ["https://upload.wikimedia.org/wikipedia/commons/e/e0/Chanakya.jpg"], 
                  quotes: [
                    { en: "Education is the best friend. An educated person is respected everywhere.", gu: "શિક્ષણ એ સૌથી સારો મિત્ર છે. શિક્ષિત વ્યક્તિ દરેક જગ્યાએ સન્માન પામે છે." },
                    { en: "A man is great by deeds, not by birth.", gu: "માણસ તેના કાર્યોથી મહાન બને છે, જન્મથી નહીં." }
                  ] 
                }
            ]
        },
        spiritual: {
            title: "🕉️ Saints & Granth",
            subs: [
                { id: "geeta", name: "Bhagavad Geeta", images: ["https://images.unsplash.com/photo-1599839619722-39751411ea63?auto=format&fit=crop&q=80"], 
                  quotes: [
                    { en: "Whenever dharma declines and adharma grows, I manifest Myself.", gu: "જ્યારે ધર્મનો નાશ થાય છે અને અધર્મ વધે છે, ત્યારે હું પ્રગટ થાઉં છું." },
                    { en: "You have the right to work, but never to the fruit of work.", gu: "તમારો અધિકાર માત્ર કર્મ કરવાનો છે, ફળની આશા રાખવાનો નહિ." },
                    { en: "The soul is neither born, and nor does it die.", gu: "આત્મા ક્યારેય જન્મતો નથી, અને તે ક્યારેય મરતો પણ નથી." }
                  ] 
                },
                { id: "ramayana", name: "Ramayana", images: ["https://images.unsplash.com/photo-1605018698943-4e8913b83648?auto=format&fit=crop&q=80"], 
                  quotes: [
                    { en: "Dharma protects those who protect Dharma.", gu: "ધર્મ રક્ષતિ રક્ષિતઃ - જે ધર્મનું રક્ષણ કરે છે, ધર્મ તેનું રક્ષણ કરે છે." },
                    { en: "A promise must be kept, even at the cost of one's life.", gu: "પ્રાણ જાય પણ વચન ન જાય. રઘુકુળ રીતિ સદા ચલી આઈ." }
                  ] 
                },
                { id: "vivekananda", name: "Swami Vivekananda", images: ["https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Swami_Vivekananda_Chicago_1893.jpg/800px-Swami_Vivekananda_Chicago_1893.jpg"], 
                  quotes: [
                    { en: "Arise, awake, and stop not till the goal is reached.", gu: "ઉઠો, જાગો અને ધ્યેય પ્રાપ્તિ સુધી મંડ્યા રહો." },
                    { en: "Take up one idea. Make that one idea your life.", gu: "કોઈ એક વિચાર લો. તે વિચારને જ તમારું જીવન બનાવી લો." }
                  ] 
                }
            ]
        },
        occasions: {
            title: "🎉 Viral Occasions",
            subs: [
                { id: "birthday", name: "Birthday Wishes", images: ["https://images.unsplash.com/photo-1558636508-e0db3814bd1d?auto=format&fit=crop&q=80"], quotes: [{ en: "Happy Birthday! Wishing you a year filled with success and joy.", gu: "જન્મદિવસની શુભકામનાઓ! તમારું આ વર્ષ સફળતા અને ખુશીઓથી ભરેલું રહે." }] },
                { id: "marriage", name: "Marriage Anniversary", images: ["https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&q=80"], quotes: [{ en: "Wishing you a lifetime of love and happiness.", gu: "તમને જીવનભરના પ્રેમ અને ખુશીઓની શુભેચ્છાઓ." }] }
            ]
        }
    };

    let userObj = { name: "Student", id: "STU0000" };
    let activeEn = "", activeGu = "";
    
    // NAVIGATION STATE
    let appState = 'main'; // main, modal_cat, poster
    let currentSource = ''; // 'gk', 'safari', 'subId'

    window.onload = () => {
        const u = localStorage.getItem('mahan_user');
        if(u) { const p = JSON.parse(u); userObj.name = p.name; userObj.id = p.user_id; }
        document.getElementById('cName').innerText = userObj.name;
        document.getElementById('cId').innerText = userObj.id;
        document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent('https://mahan-institute-english.github.io/mahan-institute-platform/register.html?ref='+userObj.id)}&margin=5`;
    };

    function handleBackNavigation() {
        if (appState === 'poster') {
            document.getElementById('posterSection').classList.add('hidden');
            document.getElementById('mainMenuSection').classList.remove('hidden');
            appState = 'main';
        } else if (appState === 'modal_cat') {
            document.getElementById('globalModal').classList.add('hidden');
            document.getElementById('mainMenuSection').classList.remove('hidden');
            appState = 'main';
        } else {
            window.location.href = 'dashboard.html'; 
        }
    }

    function closeModal() { 
        document.getElementById('globalModal').classList.add('hidden'); 
        appState = 'main';
        document.getElementById('mainMenuSection').classList.remove('hidden');
    }

    async function fetchGoogleTranslation(text, sourceLang, targetLang) {
        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
            const res = await fetch(url); const data = await res.json();
            let trans = ""; if (data && data[0]) data[0].forEach(part => { if (part[0]) trans += part[0]; });
            return trans || "Error";
        } catch (e) { return "Error connecting online."; }
    }

    // === GENERATE LIVE & RANDOM CONTENT ===
    async function generateLiveContent(source) {
        currentSource = source;
        const loader = document.getElementById('loadingOverlay');
        loader.classList.remove('hidden');
        
        let fetchedEn = ""; let bgImageUrl = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80"; 

        try {
            if (source === 'gk') {
                const res = await fetch('https://uselessfacts.jsph.pl/api/v2/facts/random');
                const data = await res.json(); fetchedEn = data.text;
                bgImageUrl = "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&q=80"; 
            } else if (source === 'safari') {
                const res = await fetch('https://catfact.ninja/fact');
                const data = await res.json(); fetchedEn = data.fact;
                bgImageUrl = "https://images.unsplash.com/photo-1545671913-b89ac1b4ac10?auto=format&fit=crop&q=80";
            } else {
                let allQuotes = []; let allImgs = [];
                for(let cat in db) {
                    db[cat].subs.forEach(sub => {
                        if(sub.id === source) { allQuotes = sub.quotes; allImgs = sub.images; }
                    });
                }
                const q = allQuotes[Math.floor(Math.random() * allQuotes.length)];
                fetchedEn = q.en; activeGu = q.gu; bgImageUrl = allImgs[0];
            }

            if(source === 'gk' || source === 'safari') {
                activeGu = await fetchGoogleTranslation(fetchedEn, 'en', 'gu');
            }
            
            activeEn = fetchedEn;
            document.getElementById('bgImg').src = bgImageUrl;
            document.getElementById('pEn').innerText = `"${activeEn}"`;
            document.getElementById('pGu').innerText = `"${activeGu}"`;
            
            loader.classList.add('hidden');
            document.getElementById('globalModal').classList.add('hidden');
            document.getElementById('mainMenuSection').classList.add('hidden');
            document.getElementById('posterSection').classList.remove('hidden');
            appState = 'poster';
            
            setTimeout(() => { document.getElementById('posterSection').scrollIntoView({ behavior: 'smooth' }); }, 300);

        } catch (error) {
            alert("Error generating content."); loader.classList.add('hidden');
        }
    }

    function generateNextRandom() {
        if(currentSource === 'custom') { alert("Type a new quote from the menu to change custom text."); return; }
        generateLiveContent(currentSource); 
    }

    // === SUB-MENU MANAGER ===
    function openSubMenu(catKey) {
        document.getElementById('globalModal').classList.remove('hidden');
        document.getElementById('mainMenuSection').classList.add('hidden');
        appState = 'modal_cat';
        
        const catData = db[catKey];
        document.getElementById('modalTitle').innerText = catData.title;
        
        let subHtml = catData.subs.map(sub => 
            `<button onclick="generateLiveContent('${sub.id}')" class="w-full bg-[#1e293b] hover:bg-slate-700 border border-slate-600 p-4 rounded-xl text-left shadow-md flex justify-between items-center transition">
                <span class="text-sm font-bold text-white">${sub.name}</span>
                <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
            </button>`
        ).join('');

        document.getElementById('modalContent').innerHTML = `
            <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-1">Select Topic to Auto-Generate</p>
            <div class="space-y-3">${subHtml}</div>
        `;
    }

    // === CUSTOM QUOTE & DICT ===
    function openCustomQuote() {
        document.getElementById('globalModal').classList.remove('hidden');
        document.getElementById('mainMenuSection').classList.add('hidden');
        appState = 'modal_cat'; 
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-nib text-pink-400"></i> My Own Quote';
        document.getElementById('modalContent').innerHTML = `
            <div class="bg-[#1e293b] p-4 rounded-2xl border border-pink-500/50 shadow-xl space-y-3">
                <p class="text-[10px] text-pink-400 uppercase font-bold tracking-widest">Type Your Quote</p>
                <textarea id="customInput" rows="3" placeholder="તમારો વિચાર અહી લખો..." class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-sm text-white outline-none focus:border-pink-500"></textarea>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="applyCustomQuote('gu', 'en')" class="bg-emerald-600 text-white text-[10px] font-bold py-3 rounded-xl transition"><i class="fa-solid fa-language"></i> Guj to Eng</button>
                    <button onclick="applyCustomQuote('en', 'gu')" class="bg-blue-600 text-white text-[10px] font-bold py-3 rounded-xl transition"><i class="fa-solid fa-language"></i> Eng to Guj</button>
                </div>
                <p id="transLoading" class="text-[10px] text-amber-400 hidden text-center animate-pulse">Translating online...</p>
            </div>
        `;
    }

    async function applyCustomQuote(sl, tl) {
        const txt = document.getElementById('customInput').value.trim();
        if(!txt) return;
        document.getElementById('transLoading').classList.remove('hidden');
        currentSource = 'custom';
        const transText = await fetchGoogleTranslation(txt, sl, tl);
        if(sl === 'gu') { activeGu = txt; activeEn = transText; } else { activeEn = txt; activeGu = transText; }
        
        document.getElementById('globalModal').classList.add('hidden');
        document.getElementById('bgImg').src = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80"; 
        document.getElementById('pEn').innerText = `"${activeEn}"`;
        document.getElementById('pGu').innerText = `"${activeGu}"`;
        document.getElementById('posterSection').classList.remove('hidden');
        appState = 'poster';
        setTimeout(() => { document.getElementById('posterSection').scrollIntoView({ behavior: 'smooth' }); }, 300);
    }

    function openDictionary() {
        document.getElementById('globalModal').classList.remove('hidden');
        document.getElementById('mainMenuSection').classList.add('hidden');
        appState = 'modal_cat'; currentCat = '';
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-book-open text-blue-400"></i> Smart Dictionary';
        document.getElementById('modalContent').innerHTML = `
            <div class="bg-[#1e293b] p-5 rounded-2xl border border-blue-500/50 shadow-xl space-y-4 text-center">
                <input type="text" id="dictInput" placeholder="e.g., Apple or How are you?" class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-4 text-white text-center font-bold focus:border-blue-500 outline-none">
                <button onclick="searchDict()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg transition"><i class="fa-solid fa-language"></i> Search Meaning</button>
                <p id="dictLoad" class="text-xs text-amber-400 hidden animate-pulse">Connecting to AI...</p>
                <div id="dictResult" class="hidden mt-4 pt-4 border-t border-slate-600 text-center">
                    <h3 id="dictGu" class="text-2xl font-black text-emerald-400 mb-4">...</h3>
                    <button onclick="playAudio()" class="bg-emerald-600 text-white w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl"><i class="fa-solid fa-volume-high"></i></button>
                </div>
            </div>
        `;
    }

    async function searchDict() {
        const word = document.getElementById('dictInput').value.trim();
        if(!word) return;
        document.getElementById('dictLoad').classList.remove('hidden'); document.getElementById('dictResult').classList.add('hidden');
        activeEn = word; activeGu = await fetchGoogleTranslation(word, 'en', 'gu');
        document.getElementById('dictGu').innerText = activeGu;
        document.getElementById('dictLoad').classList.add('hidden'); document.getElementById('dictResult').classList.remove('hidden');
        playAudio();
    }

    // === MEDIA: AMITABH BACHCHAN STYLE MALE VOICE ===
    function playAudio() {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel(); 
        
        const voices = window.speechSynthesis.getVoices();
        // Trying to find a Male voice
        let maleVoice = voices.find(v => v.name.toLowerCase().includes('male') && v.lang.includes('en')) || 
                        voices.find(v => v.lang === 'en-GB' || v.lang === 'en-IN') || 
                        voices[0];

        const mEn = new SpeechSynthesisUtterance(activeEn); 
        if(maleVoice) mEn.voice = maleVoice;
        mEn.lang = 'en-IN'; 
        mEn.rate = 0.60;  // Slow and steady
        mEn.pitch = 0.7;  // Deep, heavy voice (Amitabh style)
        
        const mGu = new SpeechSynthesisUtterance(activeGu); 
        mGu.lang = 'gu-IN'; 
        mGu.rate = 0.85;
        
        window.speechSynthesis.speak(mEn);
        mEn.onend = () => { window.speechSynthesis.speak(mGu); };
    }

    function changeBg(event) {
        if (event.target.files[0]) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById('bgImg').src = e.target.result;
            reader.readAsDataURL(event.target.files[0]);
        }
    }

    function downloadPoster() {
        const btn = document.getElementById('dlBtn');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
        const pSection = document.getElementById('posterBox');
        pSection.scrollIntoView({ behavior: 'instant' });
        setTimeout(() => {
            html2canvas(pSection, { scale: 3, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `MAHAN_Poster_${userObj.id}.jpg`; link.href = canvas.toDataURL("image/jpeg", 1.0); link.click();
                btn.innerHTML = '<i class="fa-solid fa-download"></i> Download HQ Poster';
            });
        }, 500);
    }
</script>
</body>
</html>
