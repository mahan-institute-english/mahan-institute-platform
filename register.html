<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHAN - Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="max-w-lg w-full bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-xl space-y-4 my-4">
        
        <!-- Premium CSS Logo (Emerald Green Edition) for Registration -->
        <div class="flex flex-col items-center justify-center space-y-3 mb-6 mt-2">
            <!-- MAHAN Green Badge -->
            <div class="relative flex items-center justify-center px-5 py-2.5 bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl shadow-[0_8px_16px_rgba(0,0,0,0.4)] border border-slate-700/50">
                <div class="absolute top-0 inset-x-4 h-[1px] bg-gradient-to-r from-transparent via-emerald-500 to-transparent opacity-50"></div>
                <span class="text-3xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 via-emerald-500 to-teal-600" style="font-family: 'Arial Black', sans-serif;">
                    MAHAN
                </span>
                <div class="absolute -top-1.5 -right-1.5 w-3 h-3 bg-gradient-to-br from-emerald-400 to-teal-600 rounded-full animate-pulse shadow-[0_0_10px_rgba(16,185,129,0.8)] border-2 border-slate-900"></div>
            </div>
            
            <!-- Brand Name & Sign Up Text -->
            <div class="flex flex-col items-center justify-center text-center space-y-1">
                <div class="flex items-baseline space-x-1.5">
                    <span class="text-lg font-black tracking-widest text-white uppercase leading-none">MAHAN</span>
                    <span class="text-lg font-black tracking-widest text-blue-500 uppercase leading-none">Institute</span>
                </div>
                <h2 class="text-[11px] font-bold text-emerald-500 pt-1.5 uppercase tracking-[0.2em]">New Member Registration</h2>
            </div>
        </div>
        
        <!-- Registration Form -->
        <form id="regForm" class="space-y-4">
            
            <!-- Sponsor ID -->
            <div>
                <label class="text-xs text-slate-400 font-semibold uppercase">Sponsor ID</label>
                <div class="relative mt-1">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-emerald-500">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <input type="text" id="sponsor" required class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2.5 pl-10 pr-3 text-sm text-white focus:border-emerald-500 outline-none placeholder-slate-500" placeholder="Enter Sponsor ID">
                </div>
            </div>

            <!-- Full Name -->
            <div>
                <label class="text-xs text-slate-400 font-semibold uppercase">Full Name</label>
                <input type="text" id="name" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg py-2.5 px-3 text-sm text-white focus:border-emerald-500 outline-none" placeholder="Enter Full Name">
            </div>

            <!-- Mobile & Re-enter Mobile (2 Columns) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="text-xs text-slate-400 font-semibold uppercase">Mobile Number</label>
                    <input type="tel" id="mobile" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg py-2.5 px-3 text-sm text-white focus:border-emerald-500 outline-none" placeholder="10-digit number">
                </div>
                <div>
                    <label class="text-xs text-slate-400 font-semibold uppercase">Re-Enter Mobile</label>
                    <input type="tel" id="reMobile" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg py-2.5 px-3 text-sm text-white focus:border-emerald-500 outline-none" placeholder="Confirm number">
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="text-xs text-slate-400 font-semibold uppercase">Create Password</label>
                <input type="password" id="password" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg py-2.5 px-3 text-sm text-white focus:border-emerald-500 outline-none" placeholder="••••••••">
            </div>

            <!-- State & City (2 Columns) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="text-xs text-slate-400 font-semibold uppercase">State</label>
                    <select id="state" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg py-2.5 px-3 text-sm text-white focus:border-emerald-500 outline-none appearance-none">
                        <option value="">Select State</option>
                        <option value="Gujarat">Gujarat</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Rajasthan">Rajasthan</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-slate-400 font-semibold uppercase">City</label>
                    <select id="city" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg py-2.5 px-3 text-sm text-white focus:border-emerald-500 outline-none appearance-none">
                        <option value="">Select City</option>
                        <option value="Morbi">Morbi</option>
                        <option value="Rajkot">Rajkot</option>
                        <option value="Ahmedabad">Ahmedabad</option>
                        <option value="Surat">Surat</option>
                        <option value="Vadodara">Vadodara</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <!-- Terms and Conditions -->
            <div class="pt-2">
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" id="terms" required class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-emerald-600 focus:ring-emerald-500 focus:ring-2">
                    <span class="text-xs text-slate-300">I accept terms & conditions</span>
                </label>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-lg mt-2">
                Register
            </button>
        </form>

        <p id="msg" class="text-xs text-center hidden"></p>

        <!-- Welcome Letter Box -->
        <div id="welcomeBox" class="hidden bg-slate-900 border border-emerald-500/50 p-4 rounded-xl space-y-3 mt-4">
            <div class="text-center">
                <span class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full font-bold">🎉 Registration Successful!</span>
            </div>
            <div class="space-y-1.5 text-xs text-slate-300 bg-slate-800 p-3 rounded-lg border border-slate-700 font-mono">
                <p><strong>Name:</strong> <span id="wName" class="text-white"></span></p>
                <p><strong>User ID:</strong> <span id="wId" class="text-emerald-400 font-bold text-sm"></span></p>
                <p><strong>Password:</strong> <span id="wPass" class="text-amber-400"></span></p>
                <p><strong>Sponsor:</strong> <span id="wSponsor" class="text-slate-400"></span></p>
                <p class="pt-1"><strong>Your Referral Link:</strong> <br><span id="wLink" class="text-blue-400 break-all text-[10px]"></span></p>
            </div>
            
            <a id="whatsappBtn" href="#" target="_blank" class="block w-full text-center bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg text-xs transition shadow">
                <i class="fa-brands fa-whatsapp mr-1"></i> Share Details on WhatsApp
            </a>

            <button onclick="location.href='login.html'" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-xs font-semibold">Go to Login</button>
        </div>

        <div class="text-center text-xs pt-4 border-t border-slate-700 mt-4">
            <span class="text-slate-400">Already have an account?</span> <a href="login.html" class="text-emerald-400 hover:text-emerald-300 font-semibold transition ml-1">Login</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wzrbsvwmrymkpzwmgypb.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cmJzdndtcnlta3B6d21neXBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDc1NzQsImV4cCI6MjEwMzMyMzU3NH0.5ulY5LW3AQEPFDP__iOSJssgNafTSe9Yu4gEqZF7sLc";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');
            if (ref) {
                const sponsorInput = document.getElementById('sponsor');
                sponsorInput.value = ref;
                sponsorInput.readOnly = true; 
                sponsorInput.classList.add('bg-slate-800', 'text-slate-400');
            }
        };

        async function generateUniqueId() {
            let isUnique = false;
            let newId = "";
            while (!isUnique) {
                const randomNum = Math.floor(100000 + Math.random() * 900000); 
                newId = "STU" + randomNum; 
                
                const { data } = await _supabase.from('users').select('user_id').eq('user_id', newId).maybeSingle();
                if (!data) isUnique = true; 
            }
            return newId;
        }

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            const submitBtn = document.getElementById('submitBtn');
            
            const name = document.getElementById('name').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const reMobile = document.getElementById('reMobile').value.trim();
            const password = document.getElementById('password').value.trim();
            const sponsor = document.getElementById('sponsor').value.trim();
            const state = document.getElementById('state').value;
            const city = document.getElementById('city').value;
            const terms = document.getElementById('terms').checked;

            if (mobile !== reMobile) {
                alert("❌ Mobile Number and Re-Enter Mobile Number do not match!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            msg.className = "text-xs text-center text-amber-400 block mt-2";
            msg.innerText = "Checking Details & Generating STU ID...";

            try {
                const { data: sponsorData, error: sponsorError } = await _supabase
                    .from('users').select('user_id').eq('user_id', sponsor).maybeSingle();

                if (sponsorError || !sponsorData) {
                    msg.innerText = "❌ સ્પોન્સર ID ખોટું છે અથવા મળતું નથી!";
                    msg.className = "text-xs text-center text-red-400 block mt-2";
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Register';
                    return; 
                }

                const user_id = await generateUniqueId();
                const referral_code = user_id;

                const { error } = await _supabase.from('users').insert([
                    { user_id, name, mobile, password, sponsor, referral_code, state, city, status: 'Unactive' }
                ]);

                if (error) {
                    msg.innerText = "Error: " + error.message;
                    msg.className = "text-xs text-center text-red-400 block mt-2";
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Register';
                    return;
                }

                document.getElementById('regForm').classList.add('hidden');
                msg.classList.add('hidden');

                document.getElementById('wName').innerText = name;
                document.getElementById('wId').innerText = user_id;
                document.getElementById('wPass').innerText = password;
                document.getElementById('wSponsor').innerText = sponsor;
                
                const refLink = `https://mahan-institute-english.github.io/mahan-institute-platform/register.html?v=${Date.now()}&ref=${user_id}`;
                document.getElementById('wLink').innerText = refLink;

                const waText = `🌟 *Welcome to MAHAN Institute* 🌟\n\nDear *${name}*,\nYour registration is successfully completed!\n\n🆔 User ID: *${user_id}*\n🔑 Password: *${password}*\n👥 Sponsor: ${sponsor}\n\n🔗 *Your Referral Link:*\n${refLink}\n\nJoin us and start your learning & earning journey!`;
                document.getElementById('whatsappBtn').setAttribute('href', `https://api.whatsapp.com/send?text=${encodeURIComponent(waText)}`);

                document.getElementById('welcomeBox').classList.remove('hidden');

            } catch (err) {
                msg.innerText = "Error: " + err.message;
                msg.className = "text-xs text-center text-red-400 block mt-2";
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Register';
            }
        });
    </script>
</body>
                        </html>
