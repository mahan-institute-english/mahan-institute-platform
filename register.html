<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHAN - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-xl space-y-4">
        <h2 class="text-xl font-bold text-center text-emerald-400">User Registration</h2>
        
        <form id="regForm" class="space-y-3">
            <div>
                <label class="text-xs text-slate-400">Full Name</label>
                <input type="text" id="name" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
            </div>
            <div>
                <label class="text-xs text-slate-400">Mobile Number</label>
                <input type="text" id="mobile" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
            </div>
            <div>
                <label class="text-xs text-slate-400">Email Address</label>
                <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
            </div>
            <div>
                <label class="text-xs text-slate-400">Password</label>
                <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
            </div>
            <div>
                <label class="text-xs text-slate-400">Sponsor ID / Referral Code</label>
                <input type="text" id="sponsor" value="MAHAN101" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded transition text-sm">Register Now</button>
        </form>
        <p id="msg" class="text-xs text-center"></p>
        <div class="text-center text-xs">
            <a href="login.html" class="text-emerald-400 hover:underline">Already registered? Login here</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wzrbsvwmrymkpzwmgypb.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cmJzdndtcnlta3B6d21neXBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDc1NzQsImV4cCI6MjEwMzMyMzU3NH0.5ulY5LW3AQEPFDP__iOSJssgNafTSe9Yu4gEqZF7sLc";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.innerText = "Processing registration...";
            msg.className = "text-xs text-center text-amber-400";

            const name = document.getElementById('name').value;
            const mobile = document.getElementById('mobile').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const sponsor = document.getElementById('sponsor').value;

            // Generate unique user_id
            const randomNum = Math.floor(1000 + Math.random() * 9000);
            const user_id = "MAHAN" + randomNum;

            try {
                const { data, error } = await _supabase.from('users').insert([
                    { user_id, name, mobile, email, password, sponsor, status: 'Unactive' }
                ]);

                if (error) {
                    msg.innerText = "Error: " + error.message;
                    msg.className = "text-xs text-center text-red-400";
                    return;
                }

                msg.innerText = "Registration Successful! Your ID: " + user_id;
                msg.className = "text-xs text-center text-emerald-400";
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);
            } catch (err) {
                msg.innerText = "Error: " + err.message;
                msg.className = "text-xs text-center text-red-400";
            }
        });
    </script>
</body>
    </html>
