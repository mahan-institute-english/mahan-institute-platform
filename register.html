<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHAN - Register & Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-xl space-y-4">
        <div class="text-center space-y-1">
            <span class="bg-emerald-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">MAHAN INSTITUTE</span>
            <h2 class="text-lg font-bold text-white pt-2">New User Registration</h2>
        </div>
        
        <!-- Registration Form -->
        <form id="regForm" class="space-y-3">
            <div>
                <label class="text-xs text-slate-400">Full Name</label>
                <input type="text" id="name" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:border-emerald-500 outline-none">
            </div>
            <div>
                <label class="text-xs text-slate-400">Mobile Number</label>
                <input type="text" id="mobile" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:border-emerald-500 outline-none">
            </div>
            <div>
                <label class="text-xs text-slate-400">Email Address</label>
                <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:border-emerald-500 outline-none">
            </div>
            <div>
                <label class="text-xs text-slate-400">Password</label>
                <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:border-emerald-500 outline-none">
            </div>
            <div>
                <label class="text-xs text-slate-400">Sponsor ID / Referral Code</label>
                <!-- રેફરલ લિંકથી આવતા ID માટે -->
                <input type="text" id="sponsor" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:border-emerald-500 outline-none placeholder-slate-500" placeholder="Enter Sponsor ID (e.g. MAHAN101)">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition text-sm shadow">Register Now</button>
        </form>

        <p id="msg" class="text-xs text-center"></p>

        <!-- Welcome Letter & Referral Details Box (Hidden initially) -->
        <div id="welcomeBox" class="hidden bg-slate-900 border border-emerald-500/50 p-4 rounded-xl space-y-3">
            <div class="text-center">
                <span class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full font-bold">🎉 Registration Successful!</span>
            </div>
            <div class="space-y-1.5 text-xs text-slate-300 bg-slate-800 p-3 rounded-lg border border-slate-700 font-mono">
                <p><strong>Name:</strong> <span id="wName" class="text-white"></span></p>
                <p><strong>User ID:</strong> <span id="wId" class="text-emerald-400 font-bold"></span></p>
                <p><strong>Password:</strong> <span id="wPass" class="text-amber-400"></span></p>
                <p><strong>Sponsor:</strong> <span id="wSponsor" class="text-slate-400"></span></p>
                <p class="pt-1"><strong>Your Referral Link:</strong> <br><span id="wLink" class="text-blue-400 break-all text-[10px]"></span></p>
            </div>
            
            <a id="whatsappBtn" href="#" target="_blank" class="block w-full text-center bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg text-xs transition shadow">
                <i class="fa-brands fa-whatsapp mr-1"></i> Share Details on WhatsApp
            </a>

            <button onclick="location.reload()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 py-1.5 rounded-lg text-xs">Register Another</button>
        </div>

        <div class="text-center text-xs pt-2 border-t border-slate-700">
            <a href="login.html" class="text-emerald-400 hover:underline">Already registered? Login here</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wzrbsvwmrymkpzwmgypb.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cmJzdndtcnlta3B6d21neXBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDc1NzQsImV4cCI6MjEwMzMyMzU3NH0.5ulY5LW3AQEPFDP__iOSJssgNafTSe9Yu4gEqZF7sLc";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // રેફરલ લિંક માંથી ID પકડવા અને બોક્સને લોક કરવા માટે
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');
            if (ref) {
                const sponsorInput = document.getElementById('sponsor');
                sponsorInput.value = ref;
                sponsorInput.readOnly = true; 
                sponsorInput.classList.add('bg-slate-800', 'text-slate-400');
            }
        };

        // 100% Unique ID જનરેટ કરવાનું ફંક્શન (હવે STU થી બનશે)
        async function generateUniqueId() {
            let isUnique = false;
            let newId = "";
            while (!isUnique) {
                const randomNum = Math.floor(100000 + Math.random() * 900000); // 6 આંકડાનો નંબર
                newId = "STU" + randomNum; // યુઝરની સાવ નવી ઓળખ
                
                const { data } = await _supabase
                    .from('users')
                    .select('user_id')
                    .eq('user_id', newId)
                    .maybeSingle();
                    
                if (!data) {
                    isUnique = true; 
                }
            }
            return newId;
        }

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            const submitBtn = document.getElementById('submitBtn');
            
            submitBtn.disabled = true;
            msg.innerText = "Checking Details & Generating STU ID...";
            msg.className = "text-xs text-center text-amber-400";

            const name = document.getElementById('name').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const sponsor = document.getElementById('sponsor').value.trim();

            try {
                // સ્ટેપ 1: ચેક કરો કે Sponsor ડેટાબેઝમાં છે કે નહિ
                const { data: sponsorData, error: sponsorError } = await _supabase
                    .from('users')
                    .select('user_id')
                    .eq('user_id', sponsor)
                    .maybeSingle();

                if (sponsorError || !sponsorData) {
                    msg.innerText = "❌ સ્પોન્સર ID ખોટું છે અથવા મળતું નથી!";
                    msg.className = "text-xs text-center text-red-400";
                    submitBtn.disabled = false;
                    return; 
                }

                // સ્ટેપ 2: STU સિરીઝનું નવું Unique ID બનાવો
                const user_id = await generateUniqueId();
                const referral_code = user_id;

                // સ્ટેપ 3: ડેટા સેવ કરો
                const { error } = await _supabase.from('users').insert([
                    { user_id, name, mobile, email, password, sponsor, referral_code, status: 'Unactive' }
                ]);

                if (error) {
                    msg.innerText = "Error: " + error.message;
                    msg.className = "text-xs text-center text-red-400";
                    submitBtn.disabled = false;
                    return;
                }

                document.getElementById('regForm').classList.add('hidden');
                msg.classList.add('hidden');

                document.getElementById('wName').innerText = name;
                document.getElementById('wId').innerText = user_id;
                document.getElementById('wPass').innerText = password;
                document.getElementById('wSponsor').innerText = sponsor;
                
                // કેશ પ્રોબ્લેમ સોલ્વ કરવા માટે લિંકમાં વર્ઝન (v) એડ કર્યું છે
                const refLink = `https://mahan-institute-english.github.io/mahan-institute-platform/register.html?v=${Date.now()}&ref=${user_id}`;
                document.getElementById('wLink').innerText = refLink;

                const waText = `🌟 *Welcome to MAHAN Institute* 🌟\n\nDear *${name}*,\nYour registration is successfully completed!\n\n🆔 User ID: *${user_id}*\n🔑 Password: *${password}*\n👥 Sponsor: ${sponsor}\n\n🔗 *Your Referral Link:*\n${refLink}\n\nJoin us and start your learning & earning journey!`;
                document.getElementById('whatsappBtn').setAttribute('href', `https://api.whatsapp.com/send?text=${encodeURIComponent(waText)}`);

                document.getElementById('welcomeBox').classList.remove('hidden');

            } catch (err) {
                msg.innerText = "Error: " + err.message;
                msg.className = "text-xs text-center text-red-400";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
                    </html>
